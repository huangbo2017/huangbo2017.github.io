<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目文件浏览</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f6f8fa;
        }
        h1 {
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 10px;
        }
        .breadcrumb {
            margin: 16px 0;
            font-size: 14px;
        }
        .breadcrumb a {
            color: #0969da;
            text-decoration: none;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 8px 12px;
            border-bottom: 1px solid #eaeef2;
            display: flex;
            align-items: center;
            transition: background 0.15s;
        }
        li:hover {
            background: #f0f6fc;
        }
        li a {
            color: #1f2328;
            text-decoration: none;
            display: flex;
            align-items: center;
            width: 100%;
        }
        li a .icon {
            font-size: 20px;
            margin-right: 10px;
            width: 28px;
            text-align: center;
        }
        li a .name {
            font-size: 15px;
        }
        .loading {
            text-align: center;
            color: #57606a;
            padding: 40px;
        }
        .error {
            color: #cf222e;
            background: #ffebe9;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>📂 项目文件浏览</h1>
    <div class="breadcrumb" id="breadcrumb">
        <a href="#" onclick="loadPath('')">根目录</a>
    </div>
    <div id="file-list">
        <div class="loading">加载中…</div>
    </div>

    <script>
        // ===== 修改这里的 OWNER 和 REPO =====
        const OWNER = 'huangbo2017';
        const REPO = 'huangbo2017.github.io';
        // ====================================

        // 当前所在路径（相对于仓库根目录，无前导斜杠）
        let currentPath = '';

        // 获取目录内容
        async function fetchContents(path) {
            const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            return await response.json();
        }

        // 渲染文件列表
        function renderList(items, path) {
            const container = document.getElementById('file-list');
            const breadcrumb = document.getElementById('breadcrumb');

            if (!Array.isArray(items)) {
                // 如果返回的是单个文件（极少发生，但以防万一）
                container.innerHTML = `<div class="error">返回了单个文件，不是目录。</div>`;
                return;
            }

            // 排序：文件夹在前，文件在后，按名称排序
            items.sort((a, b) => {
                if (a.type === 'dir' && b.type !== 'dir') return -1;
                if (a.type !== 'dir' && b.type === 'dir') return 1;
                return a.name.localeCompare(b.name);
            });

            let html = '<ul>';
            for (const item of items) {
                const icon = item.type === 'dir' ? '📁' : '📄';
                // 文件链接：直接指向 raw 内容（或可改为 html_url）
                let link = '';
                if (item.type === 'dir') {
                    // 文件夹：调用 loadPath 进入子目录
                    link = `href="#" onclick="loadPath('${encodeURIComponent(item.path)}'); return false;"`;
                } else {
                    // 文件：跳转到 raw 内容（也可用 item.html_url 跳转到 GitHub 页面）
                    link = `href="${item.download_url}" target="_blank"`;
                }
                html += `
                    <li>
                        <a ${link}>
                            <span class="icon">${icon}</span>
                            <span class="name">${item.name}</span>
                        </a>
                    </li>
                `;
            }
            html += '</ul>';
            container.innerHTML = html;

            // 更新面包屑
            updateBreadcrumb(path);
        }

        // 更新面包屑导航
        function updateBreadcrumb(path) {
            const breadcrumb = document.getElementById('breadcrumb');
            let parts = path.split('/').filter(p => p !== '');
            let html = `<a href="#" onclick="loadPath(''); return false;">根目录</a>`;
            let current = '';
            for (const part of parts) {
                current += (current ? '/' : '') + part;
                html += ` / <a href="#" onclick="loadPath('${encodeURIComponent(current)}'); return false;">${part}</a>`;
            }
            breadcrumb.innerHTML = html;
        }

        // 加载指定路径
        async function loadPath(path) {
            const container = document.getElementById('file-list');
            container.innerHTML = '<div class="loading">加载中…</div>';

            try {
                const data = await fetchContents(path);
                currentPath = path;
                renderList(data, path);
            } catch (error) {
                container.innerHTML = `<div class="error">❌ 加载失败：${error.message}</div>`;
            }
        }

        // 页面加载时自动读取根目录
        window.onload = function() {
            loadPath('');
        };
    </script>
</body>
</html>
