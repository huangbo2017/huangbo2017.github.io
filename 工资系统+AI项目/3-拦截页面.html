<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问确认 - 智能操作助手</title>
    <style>
        :root {
            --color-primary: #3b82f6;
            --color-primary-hover: #2563eb;
            --color-text-primary: #111827;
            --color-text-secondary: #6b7280;
            --color-border: #e5e7eb;
            --color-bg: #ffffff;
            --color-bg-subtle: #f9fafb;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius: 8px;
            --transition: 150ms ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 40px 32px 32px;
        }

        .icon-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .icon-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-circle svg {
            width: 28px;
            height: 28px;
            color: var(--color-primary);
        }

        .heading {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--color-text-secondary);
            margin-bottom: 24px;
            line-height: 1.8;
        }

        .subtitle a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .subtitle a:hover {
            text-decoration: underline;
        }

        .notice-box {
            background-color: var(--color-bg-subtle);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 24px;
        }

        .notice-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notice-title svg {
            width: 16px;
            height: 16px;
            color: #f59e0b;
            flex-shrink: 0;
        }

        .notice-text {
            font-size: 13px;
            color: var(--color-text-secondary);
            line-height: 1.7;
        }

        .notice-text a {
            color: var(--color-primary);
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .notice-text a:hover {
            text-decoration: underline;
        }

        .notice-text a svg {
            width: 12px;
            height: 12px;
        }

        .btn {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--color-primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background-color: #d1d5db;
            cursor: not-allowed;
        }

        .btn-primary:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 20px 24px;
            }

            .heading {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon-wrapper">
                <div class="icon-circle">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1zm-1 4h.01M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" />
                    </svg>
                </div>
            </div>

            <h1 class="heading">您即将前往智能操作助手</h1>
            <p class="subtitle">
                点击前往即代表你同意<a href="disclaimer.html" target="_blank" rel="noopener noreferrer">《免责声明及用户保密责任提示》</a>，请仔细阅读文件内内容
            </p>

            <div class="notice-box">
                <div class="notice-title">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z" />
                    </svg>
                    重要提示
                </div>
                <div class="notice-text">
                    点击查看完整内容：
                    <a href="disclaimer.html" target="_blank" rel="noopener noreferrer">
                        《免责声明及用户保密提示》
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                        </svg>
                    </a>
                </div>
            </div>

            <button class="btn btn-primary" id="proceedBtn">前往</button>
        </div>
    </div>

    <script>
        const proceedBtn = document.getElementById('proceedBtn');

        // 前往按钮点击事件
        proceedBtn.addEventListener('click', function() {
            // TODO: 替换为实际的智能操作助手地址
            window.location.href = '/smart-assistant';
        });
    </script>
</body>
</html>
