<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>在线咨询 - 三栏群组会话原型</title>
  <style>
    :root {
      --bg-app: #eef1fb;
      --bg-sidebar: linear-gradient(180deg, #f5f3fb 0%, #e6e8fa 100%);
      --bg-chat: linear-gradient(180deg, #f7f8fd 0%, #eef2fb 100%);
      --bg-selected: #e9f3ff;
      --bg-hover: #f2f7ff;
      --bg-user: #d8efff;
      --bg-agent: #ffffff;
      --text-strong: #213044;
      --text-body: #43536a;
      --text-muted: #8390a3;
      --line-soft: #d8e4f4;
      --line-strong: #b7d5f7;
      --accent: #2f8de4;
      --accent-strong: #1f75ca;
      --accent-soft: #e5f3ff;
      --success: #2fa66a;
      --danger: #ef4f58;
      --shadow-bubble: 0 3px 10px rgba(41, 58, 84, 0.10);
      --radius-md: 10px;
      --font-ui: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
      --sidebar-width: calc(100vw * 9 / 50);
      --nav-height: 37px;
      --side-panel-width: calc(100vw * 11 / 50);
      --composer-height: 86px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--font-ui);
      color: var(--text-body);
      background: var(--bg-app);
      overflow: hidden;
    }

    button, textarea, input { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
      background: transparent;
    }

    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      background: var(--bg-app);
    }

    .brand-rail {
      background: var(--bg-sidebar);
      border-right: 1px solid #cbdcf5;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .brand-head {
      height: var(--nav-height);
      flex: 0 0 var(--nav-height);
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 8px;
      color: var(--accent-strong);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.01em;
      border-bottom: 1px solid rgba(194, 210, 236, 0.72);
    }

    .brand-mark {
      width: 16px;
      height: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px;
      transform: rotate(-10deg);
      flex: 0 0 auto;
    }

    .brand-mark span {
      display: block;
      border-radius: 3px;
      background: var(--accent);
    }

    .brand-mark span:nth-child(2) { opacity: 0.65; transform: translateY(4px); }
    .brand-mark span:nth-child(3) { opacity: 0.75; }

    .conversation-panel {
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-height: 0;
    }

    .section-label {
      margin: 0 2px 4px;
      font-size: 11px;
      color: #617188;
    }

    .section-nav { display: none; }

    .conversation-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-height: 0;
      overflow-y: auto;
      padding-right: 1px;
    }

    .conversation-card {
      width: 100%;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      padding: 7px 6px;
      min-height: 42px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-body);
      text-align: left;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }

    .conversation-card:hover { background: var(--bg-hover); }

    .conversation-card[aria-selected="true"] {
      background: var(--bg-selected);
      border-color: var(--line-strong);
      box-shadow: 0 6px 14px rgba(47, 141, 228, 0.10);
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #57a8ec, #237ccf);
      color: #ffffff;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .avatar::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
      position: absolute;
      top: 7px;
    }

    .avatar::after {
      content: "";
      width: 18px;
      height: 11px;
      border-radius: 12px 12px 4px 4px;
      background: currentColor;
      position: absolute;
      bottom: 6px;
    }

    .avatar.group { background: linear-gradient(135deg, #78b6f0, #2f8de4); }

    .avatar.group .mini-person {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      top: 7px;
      left: 8px;
      box-shadow: 8px 2px 0 rgba(255,255,255,0.86);
    }

    .avatar.group .mini-body {
      position: absolute;
      width: 20px;
      height: 11px;
      border-radius: 12px 12px 4px 4px;
      background: #ffffff;
      bottom: 7px;
      left: 6px;
    }

    .avatar.group::before,
    .avatar.group::after { content: none; }

    .conversation-main { min-width: 0; }

    .conversation-title-row {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .conversation-title {
      color: var(--text-strong);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-kind {
      font-size: 9px;
      color: var(--accent-strong);
      background: #dceeff;
      border-radius: 99px;
      padding: 1px 4px;
      white-space: nowrap;
    }

    .conversation-preview {
      margin-top: 3px;
      display: block;
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-meta {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      gap: 4px;
      font-size: 10px;
      color: var(--text-muted);
    }

    .conversation-meta .unread-badge {
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--danger);
      color: #fff;
      font-size: 10px;
      line-height: 1;
      border-radius: 999px;
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(239, 79, 88, 0.4);
    }

    .conversation-meta .unread-badge[hidden] { display: none; }

    .main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--side-panel-width);
      grid-template-rows: var(--nav-height) minmax(0, 1fr);
      background: var(--bg-chat);
      overflow: hidden;
    }

    .top-nav {
      grid-column: 1 / -1;
      grid-row: 1;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid #bfd7f6;
      box-shadow: 0 1px 0 rgba(255,255,255,0.85) inset;
      min-width: 0;
    }

    .nav-tabs {
      height: var(--nav-height);
      display: flex;
      align-items: stretch;
      min-width: 0;
      overflow-x: auto;
    }

    .nav-tab {
      position: relative;
      min-width: 86px;
      padding: 0 16px;
      color: #6d7482;
      font-size: 13px;
      transition: color 180ms ease, background 180ms ease;
      white-space: nowrap;
    }

    .nav-tab:hover { color: var(--accent-strong); background: rgba(47, 141, 228, 0.05); }
    .nav-tab.active { color: var(--accent-strong); font-weight: 700; }

    .nav-tab.active::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 0;
      height: 2px;
      border-radius: 2px;
      background: var(--accent);
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 12px;
      color: #68788f;
      font-size: 11px;
      white-space: nowrap;
    }

    .user-icon {
      width: 13px;
      height: 13px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
      position: relative;
    }

    .user-icon::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 4px;
      border: 1.5px solid var(--accent);
      border-top: 0;
      border-radius: 0 0 8px 8px;
      left: 1.5px;
      bottom: -4px;
    }

    .chat-layout {
      grid-column: 1;
      grid-row: 2;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr;
      position: relative;
      overflow: hidden;
      border-right: 1px solid #c8dbf3;
    }

    .chat-header { display: none; }

    .message-scroll {
      min-height: 0;
      overflow-y: auto;
      padding: 8px 28px calc(var(--composer-height) + 18px);
      scroll-behavior: smooth;
    }

    .date-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 6px 0 12px;
      color: #7f8998;
      font-size: 11px;
    }

    .date-divider::before,
    .date-divider::after {
      content: "";
      width: 64px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d2dcec);
    }

    .date-divider::after { background: linear-gradient(90deg, #d2dcec, transparent); }

    .message-row {
      display: flex;
      gap: 9px;
      margin: 10px auto;
      max-width: 720px;
    }

    .message-row.user { justify-content: flex-end; }
    .message-row.user .message-stack { align-items: flex-end; }

    .message-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      min-width: 0;
      max-width: min(520px, 72%);
    }

    .sender-name {
      color: #6b7687;
      font-size: 11px;
      padding: 0 3px;
    }

    .mention {
      color: var(--accent-strong);
      font-weight: 600;
      background: #e7f2ff;
      border-radius: 4px;
      padding: 0 2px;
    }

    .message-row { position: relative; }

    .bubble {
      min-height: 33px;
      display: flex;
      align-items: center;
      border-radius: 0 var(--radius-md) var(--radius-md) var(--radius-md);
      background: var(--bg-agent);
      color: #37475c;
      padding: 5px 12px;
      box-shadow: var(--shadow-bubble);
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      border-radius: var(--radius-md) 0 var(--radius-md) var(--radius-md);
      background: var(--bg-user);
    }

    .message-avatar {
      width: 25px;
      height: 25px;
      border-radius: 5px;
      background: linear-gradient(135deg, #54a4eb, #2381da);
      flex: 0 0 auto;
      margin-top: 18px;
      position: relative;
      color: #fff;
    }

    .message-avatar::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      position: absolute;
      left: 9px;
      top: 6px;
    }

    .message-avatar::after {
      content: "";
      width: 14px;
      height: 9px;
      border-radius: 12px 12px 4px 4px;
      background: currentColor;
      position: absolute;
      left: 5.5px;
      bottom: 5px;
    }

    .attachment-card {
      width: 154px;
      padding: 7px;
      background: #d9efff;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-bubble);
    }

    .fake-thumb {
      height: 58px;
      border-radius: 5px;
      background:
        linear-gradient(90deg, rgba(47,141,228,.18) 1px, transparent 1px),
        linear-gradient(rgba(47,141,228,.12) 1px, transparent 1px),
        #f8fbff;
      background-size: 10px 10px;
      border: 1px solid #b9d9f5;
      position: relative;
      overflow: hidden;
    }

    .fake-thumb::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      top: 10px;
      height: 6px;
      background: #3b9ae8;
      border-radius: 99px;
      box-shadow: 0 12px 0 #edf4fb, 34px 12px 0 #c4dcf2, 0 24px 0 #edf4fb, 48px 24px 0 #c4dcf2;
    }

    .fake-thumb::after {
      content: "";
      position: absolute;
      width: 44px;
      height: 30px;
      right: 11px;
      bottom: 8px;
      border-bottom: 2px solid #7c8ca0;
      border-left: 2px solid #7c8ca0;
      transform: skewX(-18deg);
      background: linear-gradient(135deg, transparent 46%, #8a98aa 47%, #8a98aa 51%, transparent 52%);
    }

    .attachment-title {
      margin-top: 6px;
      color: #36516c;
      font-size: 11px;
    }

    .file-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 280px;
    }

    .file-card {
      min-height: 33px;
      display: grid;
      grid-template-columns: 24px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 5px;
      border-radius: 9px;
      background: #ffffff;
      box-shadow: var(--shadow-bubble);
      border: 1px solid rgba(204, 219, 238, 0.68);
      color: #37475c;
      font-size: 13px;
      line-height: 1.45;
    }

    .file-icon {
      width: 23px;
      height: 23px;
      border-radius: 5px;
      color: #ffffff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 9px;
    }

    .file-icon.doc { background: #4f8ff0; }
    .file-icon.xls { background: #24a458; }
    .file-icon.pdf { background: #fb5a57; }
    .file-icon.zip { background: #8b6cf0; }
    .file-icon.img { background: #2f9a8f; }

    .file-name {
      color: #37475c;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .download-link {
      color: #4477ff;
      font-size: 13px;
      text-decoration: none;
    }

    .download-link:hover { text-decoration: underline; }

    .rating-bubble {
      min-height: 33px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 5px 11px;
      border-radius: 0 var(--radius-md) var(--radius-md) var(--radius-md);
      background: #ffffff;
      box-shadow: var(--shadow-bubble);
      color: #37475c;
      font-size: 13px;
      line-height: 1.4;
    }

    .rating-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .rating-button {
      min-width: 64px;
      height: 24px;
      padding: 0 12px;
      border-radius: 5px;
      background: #ffffff;
      border: 1px solid #c8d2df;
      color: #4d5d72;
      font-size: 12px;
      line-height: 22px;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .rating-button:hover,
    .rating-button[aria-pressed="true"] {
      background: #2f8de4;
      border-color: #2f8de4;
      color: #ffffff;
      font-weight: 700;
    }

    .rating-button:active { transform: scale(0.98); }

    .rating-result-row {
      justify-content: center;
      margin-top: 8px;
    }

    .rating-result-row .message-stack {
      max-width: min(520px, 72%);
      align-items: center;
    }

    .rating-result {
      min-height: 33px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px 16px;
      border-radius: 5px;
      background: #dfe9ff;
      color: #7387aa;
      font-size: 13px;
      line-height: 1.4;
    }

    .composer {
      position: fixed;
      left: calc(var(--sidebar-width) + 28px);
      right: calc(var(--side-panel-width) + 28px);
      bottom: 7px;
      z-index: 30;
      min-height: var(--composer-height);
      background: #ffffff;
      border: 1px solid #b9d4f4;
      border-radius: 3px;
      box-shadow: 0 10px 22px rgba(35, 77, 125, 0.12);
      overflow: hidden;
    }

    .composer-body {
      position: relative;
      padding: 7px 10px 6px;
    }

    .composer-main {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .pending-attachment {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      max-width: 100%;
      min-height: 25px;
      padding: 3px 9px 3px 5px;
      border-radius: 7px;
      background: #eef6ff;
      border: 1px solid #cadcf0;
      color: #42607f;
      font-size: 11px;
      line-height: 1.2;
    }

    .pending-attachment[hidden],
    .risk-tip.hidden { display: none; }

    .pending-icon {
      width: 19px;
      height: 19px;
      border-radius: 5px;
      background: #dbeafe;
      color: #2f8de4;
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .pending-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mention-pop {
      position: absolute;
      left: 0;
      bottom: calc(100% + 6px);
      z-index: 40;
      width: 220px;
      max-height: 200px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #cfe0f4;
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(35, 77, 125, 0.18);
      padding: 4px;
    }

    .mention-pop[hidden] { display: none; }

    .mention-item {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      padding: 5px 8px;
      border-radius: 7px;
      border: none;
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      color: #33465e;
    }

    .mention-item:hover,
    .mention-item.active { background: #eef6ff; }

    .mention-item .mini-ava {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #e5f1ff;
      color: var(--accent-strong);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .mention-item .mini-tag {
      margin-left: auto;
      font-size: 10px;
      color: var(--accent-strong);
      background: #e7f2ff;
      border-radius: 4px;
      padding: 0 5px;
    }

    .mention-empty {
      padding: 8px;
      font-size: 11px;
      color: #97a3b6;
      text-align: center;
    }

    .pending-remove {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #e8f0fa;
      color: #7a899d;
      font-size: 12px;
      flex: 0 0 auto;
    }

    .pending-remove:hover { background: #dce9f7; color: #3b556f; }

    .composer-tools {
      display: flex;
      align-items: center;
      margin-top: 1px;
    }

    .local-upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid #cfe0f4;
      color: var(--accent-strong);
      font-size: 12px;
      line-height: 1.4;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .local-upload-btn svg {
      width: 15px;
      height: 15px;
    }

    .local-upload-btn:hover {
      background: #eef6ff;
      border-color: #b9d4f4;
    }

    .local-upload-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .composer textarea {
      width: 100%;
      min-height: 44px;
      max-height: 120px;
      resize: vertical;
      border: 0;
      background: transparent;
      padding: 4px 86px 6px 2px;
      color: #324257;
      line-height: 1.5;
      font-size: 13px;
    }

    .composer textarea::placeholder { color: #a7b2c2; }

    .voice-status {
      color: #a7b2c2;
      font-size: 11px;
      white-space: nowrap;
    }

    .voice-status.active { color: #2f8de4; }

    .send-area {
      position: absolute;
      right: 10px;
      bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: auto;
      z-index: 2;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 6px;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 150ms ease, transform 120ms ease;
      flex-shrink: 0;
      color: #5d6d7e;
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
    }

    .icon-btn:hover {
      background: #eef2f7;
      color: #2f8de4;
    }

    .icon-btn:active { transform: scale(0.92); }

    .voice-btn[aria-pressed="true"] { color: var(--accent-strong); }

    .send-btn:hover { color: var(--accent-strong); }

    .risk-tip {
      padding: 0 10px 6px;
      color: var(--danger);
      font-size: 11px;

          { name: "合同专员", role: "业务成员", state: "离线" },
          { name: "财务复核", role: "复核人", state: "离线" },
          { name: "仓储协同", role: "业务成员", state: "在线" }
        ],
        files: [
          { name: "采购流程操作手册.pdf", type: "pdf", size: "1.6MB", uploader: "向钱进" },
          { name: "供应商信息导入模板.xlsx", type: "xls", size: "310KB", uploader: "单位管理员" },
          { name: "合同审核材料清单.docx", type: "doc", size: "488KB", uploader: "合同专员" }
        ],
        messages: [
          { type: "divider", text: "2026年4月2日　13:22:26" },
          { side: "user", name: "我", text: "如何进行多单位询问切换？" },
          { side: "agent", name: "人工：向钱进", text: "如同一经办人管理多个单位，可多次单位注册后，在登录界面下拉选择进行单位切换。" },
          { side: "member", name: "采购一组", text: "切换单位后，历史咨询记录还会保留吗？" },
          { side: "agent", name: "人工：向钱进", text: "会保留。左侧列表会按“在线客服”和各群聊分别展示，点击不同会话即可切换查看。" }
        ]
      },
      implementation: {
        title: "实施上线支持群",
        subtitle: "群聊 · 16名成员 · 上线准备、模板配置、数据核验",
        avatar: "group",
        actions: [],
        composer: "请输入你的问题",
        panelMode: "group",
        unread: 2,
        announcement: {
          title: "群公告",
          body: "上线前请按数据核验清单逐项确认，导入文件统一上传至群文件区。遇到阻塞问题请说明菜单路径、操作账号和错误提示截图，便于快速定位。每周五 18:00 同步本周遗留问题至项目管理员，未闭环事项需在群内同步进展与预计完成时间。"
        },
        members: [
          { name: "周顾问", role: "人工客服", state: "在线", admin: true },
          { name: "系统顾问", role: "系统助手", state: "在线" },
          { name: "钱多多", role: "人工客服", state: "在线" },
          { name: "向钱进", role: "人工客服", state: "在线" },
          { name: "实施A组", role: "实施人员", state: "在线" },
          { name: "实施B组", role: "实施人员", state: "离线" },
          { name: "数据核验", role: "复核人", state: "在线" },
          { name: "项目管理员", role: "管理员", state: "离线", admin: true }
        ],
        files: [
          { name: "上线数据核验清单.xlsx", type: "xls", size: "760KB", uploader: "系统顾问" },
          { name: "初始化配置指南.pdf", type: "pdf", size: "2.1MB", uploader: "周顾问" },
          { name: "问题排查记录表.docx", type: "doc", size: "436KB", uploader: "实施A组" }
        ],
        messages: [
          { type: "divider", text: "昨天　17:42:10" },
          { side: "agent", name: "系统顾问", text: "已同步最新导入模板，群文件中可下载“上线数据核验清单”。" },
          { side: "member", name: "实施A组", text: "人员基础信息导入后，哪些字段建议优先复核？" },
          { side: "agent", name: "人工：周顾问", text: "建议优先复核单位、部门、岗位、证件号、起薪日期和工资项。证件号仅在本地核验，不建议在群内明文发送。" },
          { side: "user", name: "我", text: "收到，我先按清单过一遍。" }
        ]
      }
    };

    const messageList = document.getElementById("messageList");
    const detailPanel = document.getElementById("detailPanel");
    const chatTitle = document.getElementById("chatTitle");
    const chatSubtitle = document.getElementById("chatSubtitle");
    const headerActions = document.getElementById("headerActions");
    const headerAvatar = document.getElementById("headerAvatar");
    const messageInput = document.getElementById("messageInput");
    const composerForm = document.getElementById("composerForm");
    const voiceButton = document.getElementById("voiceButton");
    const voiceStatus = document.getElementById("voiceStatus");
    const pendingAttachment = document.getElementById("pendingAttachment");
    const pendingAttachmentIcon = document.getElementById("pendingAttachmentIcon");
    const pendingAttachmentName = document.getElementById("pendingAttachmentName");
    const pendingAttachmentRemove = document.getElementById("pendingAttachmentRemove");
    const riskTip = document.getElementById("riskTip");
    let activeChatKey = "group";
    let voiceActive = false;
    let attachmentDraft = null;

    function avatarMarkup(side) {
      return side === "user" ? "" : '<span class="message-avatar" aria-hidden="true"></span>';
    }

    function fileMarkup(files) {
      return `<div class="file-stack">${files.map((file) => `
        <div class="file-card">
          <span class="file-icon ${file.type}">${file.type.toUpperCase()}</span>
          <span class="file-name">${escapeHtml(file.name)}</span>
          <a class="download-link" href="javascript:void(0)" aria-label="下载${escapeHtml(file.name)}">下载</a>
        </div>
      `).join("")}</div>`;
    }

    function ratingMarkup(message) {
      return `
        <div class="rating-bubble">
          <span>${escapeHtml(message.text)}</span>
          <span class="rating-actions">
            ${message.rating.map((label) => `<button class="rating-button" type="button" aria-pressed="${message.selectedRating === label ? "true" : "false"}" data-rating="${label}">${label}</button>`).join("")}
          </span>
        </div>
      `;
    }

    function ratingResultMarkup(message) {
      if (!message.selectedRating) return "";
      return `
        <div class="message-row rating-result-row" aria-live="polite">
          <div class="message-stack">
            <div class="rating-result">您对本次服务评价“${message.selectedRating}”</div>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function renderText(text, chat) {
      let html = escapeHtml(text || "");
      const names = (chat && chat.members ? chat.members : []).map((m) => m.name).filter(Boolean);
      if (names.length) {
        const pattern = names.map((n) => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
        html = html.replace(new RegExp("@(" + pattern + ")", "g"), '<span class="mention">@$1</span>');
      }
      return html;
    }

    function attachmentMarkup(message, chat) {
      if (message.files) return fileMarkup(message.files);
      if (message.rating) return ratingMarkup(message);
      if (!message.attachment) return `<div class="bubble">${renderText(message.text, chat)}</div>`;
      return `
        <div class="attachment-card">
          <div class="fake-thumb" aria-label="截图缩略图"></div>
          <div class="attachment-title">${renderText(message.text, chat)}</div>
        </div>
      `;
    }

    function renderMessages(chat) {
      messageList.innerHTML = chat.messages.map((message, index) => {
        if (message.type === "divider") {
          return `<div class="date-divider">${escapeHtml(message.text)}</div>`;
        }
        const sideClass = message.side === "user" ? "user" : "agent";
        const avatar = avatarMarkup(message.side);
        const content = `
          <div class="message-stack">
            <div class="sender-name">${escapeHtml(message.name)}</div>
            ${attachmentMarkup(message, chat)}
          </div>`;
        const messageRow = `<div class="message-row ${sideClass}" data-message-index="${index}">${message.side === "user" ? content + avatar : avatar + content}</div>`;
        return message.rating ? messageRow + ratingResultMarkup(message) : messageRow;
      }).join("");
      messageList.scrollTop = messageList.scrollHeight;
    }

    function renderMembers(members) {
      return members.map((member) => {
        const isAdmin = member.admin === true;
        return `
        <div class="member-item" data-member="${escapeHtml(member.name)}" title="点击 @ 该成员">
          <span class="member-avatar">${escapeHtml(member.name.slice(0, 1))}</span>
          <span class="member-info">
            <span class="member-name">${escapeHtml(member.name)}</span>
            ${isAdmin ? `<span class="member-tag">管理员</span>` : ""}
          </span>
          <span class="member-state ${member.state === "离线" ? "offline" : ""}">${escapeHtml(member.state)}</span>
        </div>
      `;
      }).join("");
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + "B";
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + "KB";
      return (bytes / 1048576).toFixed(1) + "MB";
    }

    function fileTypeIcon(type) {
      const map = {
        xls: "📊", xlsx: "📊", csv: "📊",
        doc: "📄", docx: "📄", txt: "📄",
        pdf: "📕",
        img: "🖼️", png: "🖼️", jpg: "🖼️", jpeg: "🖼️", gif: "🖼️", svg: "🖼️",
        zip: "📦", rar: "📦", "7z": "📦"
      };
      return map[type] || "📎";
    }

    function renderPanelFiles(files) {
      return files.map((file, index) => {
        const isMine = file.uploader === "我";
        const deleteBtn = isMine
          ? `<button class="file-row-delete" type="button" data-file-index="${index}" aria-label="删除${escapeHtml(file.name)}">删除</button>`
          : "";
        return `
        <div class="file-row">
          <span class="file-type-icon">${fileTypeIcon(file.type)}</span>
          <span class="file-row-main">
            <span class="file-row-name">${escapeHtml(file.name)}</span>
            <span class="file-row-meta">${escapeHtml(file.size)} · ${escapeHtml(file.uploader)}</span>
          </span>
          <span class="file-row-actions">
            <a class="file-row-action" href="javascript:void(0)" aria-label="下载${escapeHtml(file.name)}">下载</a>
            ${deleteBtn}
          </span>
        </div>
      `;
      }).join("");
    }

    function renderDetailPanel(chat) {
      const memberTitle = chat.panelMode === "group" ? "群成员" : "服务人员";
      const fileTitle = chat.panelMode === "group" ? "群文件" : "咨询文件";
      const showGroupAreas = chat.panelMode === "group";
      const isService = chat.panelMode === "service";
      const ann = chat.announcement;
      const annHtml = isService
        ? `<ol class="notice-list">${ann.tips.map((t) => `<li>${escapeHtml(t)}</li>`).join("")}</ol>`
        : `<div class="notice-row"><p class="notice-text">${escapeHtml(ann.body)}</p></div>`;

      detailPanel.innerHTML = `
        <section class="detail-section announcement" aria-label="${ann.title}">
          <div class="detail-content">
            <div class="detail-title-bar">
              <span>${ann.title}</span>
              <span class="detail-badge">置顶</span>
            </div>
            <div class="notice-body">${annHtml}</div>
          </div>
        </section>

        ${showGroupAreas ? `
        <section class="detail-section members" aria-label="${memberTitle}">
          <div class="detail-content">
            <div class="detail-title-bar">
              <span>${memberTitle}</span>
              <span class="detail-badge">${chat.members.length}人</span>
            </div>
            <div class="member-list">${renderMembers(chat.members)}</div>
          </div>
        </section>

        <section class="detail-section files" aria-label="${fileTitle}">
          <div class="detail-content">
            <div class="detail-title-bar">
              <span>${fileTitle}</span>
              <span class="detail-badge">${chat.files.length}个</span>
            </div>
            <div class="file-panel-tools">
              <input type="file" id="panelFileInput" hidden accept=".xls,.xlsx,.csv,.doc,.docx,.txt,.pdf,.png,.jpg,.jpeg,.gif,.svg,.zip,.rar,.7z" />
              <button class="upload-button" type="button" id="panelUploadFile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 16V4"></path>
                  <path d="M7 9l5-5 5 5"></path>
                  <path d="M5 20h14"></path>
                </svg>
                <span>上传文件</span>
              </button>
            </div>
            <div class="file-list">${renderPanelFiles(chat.files)}</div>
          </div>
        </section>
        ` : ``}
      `;

      if (showGroupAreas) {
        const panelUploadBtn = document.getElementById("panelUploadFile");
        const panelFileInput = document.getElementById("panelFileInput");
        panelUploadBtn.addEventListener("click", () => { panelFileInput.click(); });
        panelFileInput.addEventListener("change", (event) => {
          const files = Array.from(event.target.files || []);
          files.forEach((f) => {
            const ext = f.name.split(".").pop().toLowerCase();
            const chat = chats[activeChatKey];
            const newFile = { name: f.name, type: ext, size: formatFileSize(f.size), uploader: "我" };
            chat.files.unshift(newFile);
            chat.messages.push({ side: "user", name: "我", files: [{ name: newFile.name, type: newFile.type }] });
          });
          renderMessages(chats[activeChatKey]);
          renderDetailPanel(chats[activeChatKey]);
          panelFileInput.value = "";
        });

        detailPanel.querySelectorAll(".file-row-delete").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = Number(btn.dataset.fileIndex);
            const chat = chats[activeChatKey];
            if (idx >= 0 && idx < chat.files.length) {
              chat.files.splice(idx, 1);
              renderDetailPanel(chat);
            }
          });
        });
      }
    }

    function renderHeader(chat) {
      chatTitle.textContent = chat.title;
      chatSubtitle.textContent = chat.subtitle;
      messageInput.placeholder = chat.composer;
      headerAvatar.className = chat.avatar === "group" ? "avatar group" : "avatar";
      headerAvatar.innerHTML = chat.avatar === "group" ? '<span class="mini-person"></span><span class="mini-body"></span>' : "";
      headerActions.innerHTML = chat.actions.map((item) => `<span class="pill">${item}</span>`).join("");
    }

    function updateAttachmentTipVisibility() {
      pendingAttachment.hidden = !attachmentDraft;
      riskTip.classList.toggle("hidden", !(attachmentDraft && attachmentDraft.source === "paste"));
      if (attachmentDraft) {
        pendingAttachmentIcon.textContent = attachmentDraft.kind === "file" ? "文" : "图";
        pendingAttachmentName.textContent = attachmentDraft.name;
      }
    }

    function setAttachmentDraft(nextDraft) {
      attachmentDraft = nextDraft;
      updateAttachmentTipVisibility();
    }

    function toggleVoice() {
      voiceActive = !voiceActive;
      voiceButton.setAttribute("aria-pressed", String(voiceActive));
      voiceStatus.textContent = voiceActive ? "正在录音…松开发送" : "Shift+Enter 换行　　Enter直接发送";
      voiceStatus.classList.toggle("active", voiceActive);
    }

    function addPanelFile(type) {
      const chat = chats[activeChatKey];
      const newFile = type === "img"
        ? { name: "问题截图.png", type: "img", size: "326KB", uploader: "我" }
        : { name: "补充材料.docx", type: "doc", size: "458KB", uploader: "我" };
      chat.files.unshift(newFile);
      chat.messages.push({ side: "user", name: "我", files: [{ name: newFile.name, type: newFile.type }] });
      renderMessages(chat);
      renderDetailPanel(chat);
    }

    let mentionState = null;
    let mentionActive = -1;

    const mentionPop = document.getElementById("mentionPop");

    function renderSidebarBadges() {
      document.querySelectorAll(".conversation-card").forEach((button) => {
        const chat = chats[button.dataset.chat];
        const badge = button.querySelector(".unread-badge");
        if (!badge || !chat) return;
        const count = chat.unread || 0;
        badge.textContent = count > 99 ? "99+" : String(count);
        badge.hidden = count <= 0;
      });
    }

    function insertMention(name) {
      const el = messageInput;
      const start = el.selectionStart ?? el.value.length;
      const end = el.selectionEnd ?? el.value.length;
      const before = el.value.slice(0, start);
      const after = el.value.slice(end);
      const prefix = before === "" || /\s$/.test(before) ? "" : " ";
      const insert = prefix + "@" + name + " ";
      el.value = before + insert + after;
      const pos = (before + insert).length;
      el.focus();
      el.setSelectionRange(pos, pos);
    }

    function hideMentionPop() {
      mentionPop.hidden = true;
      mentionPop.innerHTML = "";
      mentionActive = -1;
    }

    function updateMentionActive(items) {
      items.forEach((it, i) => it.classList.toggle("active", i === mentionActive));
    }

    function showMentionPop(query) {
      const chat = chats[activeChatKey];
      if (!chat || chat.panelMode !== "group") { hideMentionPop(); return; }
      const q = (query || "").toLowerCase();
      const list = chat.members.filter((m) => m.name.toLowerCase().includes(q));
      if (!list.length) {
        mentionPop.innerHTML = '<div class="mention-empty">无匹配成员</div>';
        mentionPop.hidden = false;
        mentionActive = -1;
        return;
      }
      mentionPop.innerHTML = list.map((m, i) => `
        <button class="mention-item${i === 0 ? " active" : ""}" type="button" data-name="${escapeHtml(m.name)}">
          <span class="mini-ava">${escapeHtml(m.name.slice(0, 1))}</span>
          <span>${escapeHtml(m.name)}</span>
          ${m.admin ? '<span class="mini-tag">管理员</span>' : ""}
        </button>
      `).join("");
      mentionPop.hidden = false;
      mentionActive = 0;
      mentionPop.querySelectorAll(".mention-item").forEach((item) => {
        item.addEventListener("click", () => selectMention(item.dataset.name));
      });
    }

    function selectMention(name) {
      if (mentionState == null) return;
      const el = messageInput;
      const pos = el.selectionStart ?? el.value.length;
      const before = el.value.slice(0, mentionState.start);
      const after = el.value.slice(pos);
      el.value = before + "@" + name + " " + after;
      const newPos = (before + "@" + name + " ").length;
      el.focus();
      el.setSelectionRange(newPos, newPos);
      hideMentionPop();
      mentionState = null;
    }

    function setActiveChat(key) {
      activeChatKey = key;
      document.querySelectorAll(".conversation-card").forEach((button) => {
        const selected = button.dataset.chat === key;
        button.setAttribute("aria-selected", String(selected));
      });
      chats[key].unread = 0;
      hideMentionPop();
      mentionState = null;
      renderHeader(chats[key]);
      renderMessages(chats[key]);
      renderDetailPanel(chats[key]);
      renderSidebarBadges();
    }

    document.querySelectorAll(".conversation-card").forEach((button) => {
      button.addEventListener("click", () => setActiveChat(button.dataset.chat));
    });

    pendingAttachmentRemove.addEventListener("click", () => {
      setAttachmentDraft(null);
      voiceStatus.textContent = voiceActive ? "正在录音…松开发送" : "Shift+Enter 换行　　Enter直接发送";
      voiceStatus.classList.toggle("active", voiceActive);
    });

    voiceButton.addEventListener("click", toggleVoice);

    const localUploadBtn = document.getElementById("localUploadBtn");
    const localFileInput = document.getElementById("localFileInput");
    localUploadBtn.addEventListener("click", () => { localFileInput.click(); });
    localFileInput.addEventListener("change", (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const ext = file.name.split(".").pop().toLowerCase();
      setAttachmentDraft({ name: file.name, source: "local", kind: "file", fileType: ext, size: formatFileSize(file.size) });
      voiceStatus.textContent = "已选择文件，点击发送上传";
      voiceStatus.classList.add("active");
      localFileInput.value = "";
    });

    messageList.addEventListener("click", (event) => {
      if (!event.target.classList.contains("rating-button")) return;
      const messageRow = event.target.closest(".message-row");
      const messageIndex = Number(messageRow.dataset.messageIndex);
      const message = chats[activeChatKey].messages[messageIndex];
      if (!message || !message.rating) return;
      message.selectedRating = event.target.dataset.rating;
      renderMessages(chats[activeChatKey]);
    });

    composerForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const value = messageInput.value.trim();
      if (!value && !attachmentDraft && !voiceActive) return;
      const chat = chats[activeChatKey];
      if (attachmentDraft) {
        if (attachmentDraft.kind === "file") {
          const fileType = attachmentDraft.fileType || "doc";
          chat.messages.push({ side: "user", name: "我", files: [{ name: attachmentDraft.name, type: fileType }] });
          chat.files.unshift({ name: attachmentDraft.name, type: fileType, size: attachmentDraft.size || "458KB", uploader: "我" });
        } else {
          chat.messages.push({ side: "user", name: "我", attachment: true, text: "图片消息" });
          chat.files.unshift({ name: "用户上传截图.png", type: "img", size: "326KB", uploader: "我" });
        }
      }
      if (voiceActive) {
        chat.messages.push({ side: "user", name: "我", text: "语音消息" });
        voiceActive = false;
        voiceButton.setAttribute("aria-pressed", "false");
      }
      if (value) {
        chat.messages.push({ side: "user", name: "我", text: value });
      }
      messageInput.value = "";
      setAttachmentDraft(null);
      voiceStatus.textContent = "Shift+Enter 换行　　Enter直接发送";
      voiceStatus.classList.remove("active");
      renderMessages(chat);
      renderDetailPanel(chat);
    });

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        composerForm.requestSubmit();
      }
    });

    messageInput.addEventListener("paste", (event) => {
      const items = Array.from(event.clipboardData?.items || []);
      const pastedImage = items.find((item) => item.type.startsWith("image/"));
      if (!pastedImage) return;
      setAttachmentDraft({ name: "已粘贴图片", source: "paste", kind: "image" });
      voiceStatus.textContent = "检测到图片粘贴";
      voiceStatus.classList.add("active");
    });

    setActiveChat(activeChatKey);
    updateAttachmentTipVisibility();
  </script>
</body>
</html>
