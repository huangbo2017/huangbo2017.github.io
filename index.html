<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目文件浏览</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f6f8fa;
        }
        h1 {
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 10px;
        }
        .breadcrumb {
            margin: 16px 0;
            font-size: 14px;
        }
        .breadcrumb a {
            color: #0969da;
            text-decoration: none;
            cursor: pointer;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 8px 12px;
            border-bottom: 1px solid #eaeef2;
            display: flex;
            align-items: center;
            transition: background 0.15s;
            cursor: pointer;
        }
        li:hover {
            background: #f0f6fc;
        }
        li .icon {
            font-size: 20px;
            margin-right: 10px;
            width: 28px;
            text-align: center;
        }
        li .name {
            font-size: 15px;
            flex: 1;
        }
        .chevron {
            margin-left: auto;
            transition: transform 0.2s;
            font-size: 12px;
            color: #57606a;
        }
        .chevron.open {
            transform: rotate(90deg);
        }
        .nested {
            padding-left: 24px;
            display: none;
        }
        .nested.active {
            display: block;
        }
        .loading {
            text-align: center;
            color: #57606a;
            padding: 20px;
        }
        .error {
            color: #cf222e;
            background: #ffebe9;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>📂 项目文件浏览</h1>
    <div class="breadcrumb" id="breadcrumb">
        <a onclick="loadPath('')">根目录</a>
    </div>
    <div id="file-tree">
        <div class="loading">加载中…</div>
    </div>

    <script>
        // ===================== 配置区 =====================
        const OWNER = 'huangbo2017';
        const REPO = 'huangbo2017.github.io';  // 这是你的 Pages 仓库
        const BRANCH = 'main';                 // 或 'master'
        // =================================================

        // 判断是否为 Pages 根仓库（即 REPO 为 username.github.io）
        const isPagesRepo = REPO === `${OWNER}.github.io`;

        // 缓存已加载的目录数据
        const cache = new Map();

        // 获取目录内容（使用 GitHub API）
        async function fetchDirectory(path) {
            if (cache.has(path)) {
                return cache.get(path);
            }
            const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                // 排序：文件夹在前，文件在后
                data.sort((a, b) => {
                    if (a.type === 'dir' && b.type !== 'dir') return -1;
                    if (a.type !== 'dir' && b.type === 'dir') return 1;
                    return a.name.localeCompare(b.name);
                });
                cache.set(path, data);
                return data;
            } catch (error) {
                console.error(`Fetch ${path} failed:`, error);
                throw error;
            }
        }

        // 构建文件树（递归可展开）
        async function buildTree(container, path = '') {
            try {
                const items = await fetchDirectory(path);
                const ul = document.createElement('ul');

                for (const item of items) {
                    const li = document.createElement('li');
                    const isDir = item.type === 'dir';

                    // 图标
                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'icon';
                    iconSpan.textContent = isDir ? '📁' : getFileIcon(item.name);

                    // 文件名
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'name';
                    nameSpan.textContent = item.name;

                    li.appendChild(iconSpan);
                    li.appendChild(nameSpan);

                    if (isDir) {
                        // ----- 文件夹：点击展开/折叠 -----
                        const chevron = document.createElement('span');
                        chevron.className = 'chevron';
                        chevron.textContent = '▶';
                        li.appendChild(chevron);

                        const childContainer = document.createElement('div');
                        childContainer.className = 'nested';
                        li.appendChild(childContainer);

                        li.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            const isActive = childContainer.classList.toggle('active');
                            chevron.classList.toggle('open', isActive);

                            if (isActive && childContainer.children.length === 0) {
                                childContainer.innerHTML = '<div class="loading">加载中...</div>';
                                try {
                                    await buildTree(childContainer, item.path);
                                } catch (err) {
                                    childContainer.innerHTML = `<div class="error">加载失败: ${err.message}</div>`;
                                }
                            }
                        });
                    } else {
                        // ----- 文件：点击跳转到 Pages 地址 -----
                        li.style.cursor = 'pointer';
                        li.addEventListener('click', () => {
                            // 构建 Pages URL
                            let fileUrl;
                            if (isPagesRepo) {
                                // 如果是 Pages 仓库，根路径就是 https://OWNER.github.io/
                                fileUrl = `https://${OWNER}.github.io/${item.path}`;
                            } else {
                                // 普通仓库，Pages 路径为 https://OWNER.github.io/REPO/item.path
                                fileUrl = `https://${OWNER}.github.io/${REPO}/${item.path}`;
                            }
                            window.location.href = fileUrl;
                        });
                    }

                    ul.appendChild(li);
                }

                container.innerHTML = '';
                container.appendChild(ul);

                // 更新面包屑
                updateBreadcrumb(path);

            } catch (error) {
                container.innerHTML = `<div class="error">❌ 加载目录失败: ${error.message}</div>`;
            }
        }

        // 更新面包屑导航
        function updateBreadcrumb(path) {
            const breadcrumb = document.getElementById('breadcrumb');
            const parts = path.split('/').filter(p => p !== '');
            let html = `<a onclick="loadPath('')">根目录</a>`;
            let current = '';
            for (const part of parts) {
                current += (current ? '/' : '') + part;
                html += ` / <a onclick="loadPath('${encodeURIComponent(current)}')">${part}</a>`;
            }
            breadcrumb.innerHTML = html;
        }

        // 加载指定路径（用于面包屑点击）
        async function loadPath(path) {
            const container = document.getElementById('file-tree');
            container.innerHTML = '<div class="loading">加载中…</div>';
            try {
                await buildTree(container, path);
            } catch (error) {
                container.innerHTML = `<div class="error">加载失败: ${error.message}</div>`;
            }
        }

        // 获取文件图标
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const map = {
                'html': '🌐', 'htm': '🌐',
                'md': '📝',
                'js': '📜', 'ts': '📜',
                'css': '🎨', 'scss': '🎨',
                'json': '📦',
                'png': '🖼️', 'jpg': '🖼️', 'jpeg': '🖼️', 'gif': '🖼️', 'svg': '🖼️', 'webp': '🖼️',
                'mp4': '🎬', 'webm': '🎬', 'ogg': '🎬',
                'mp3': '🎵', 'wav': '🎵',
                'pdf': '📄',
                'zip': '📦', 'rar': '📦', '7z': '📦',
                'py': '🐍', 'java': '☕', 'c': '⚙️', 'cpp': '⚙️', 'go': '🐹', 'rs': '🦀'
            };
            return map[ext] || '📄';
        }

        // 初始化：加载根目录
        window.onload = function() {
            const container = document.getElementById('file-tree');
            buildTree(container, '');
        };
    </script>
</body>
</html>
