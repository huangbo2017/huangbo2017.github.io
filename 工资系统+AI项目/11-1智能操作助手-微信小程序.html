<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工资系统AI助手 - 微信小程序</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #e8ebf0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ========== 手机外框 ========== */
  .phone {
    width: 390px;
    height: 640px;
    position: relative;
    background: #f2f4f7;
    border-radius: 12px;
    box-shadow: 0 8px 40px rgba(30,60,110,.25);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid #d5dae2;
  }

  /* ========== 状态栏 ========== */
  .status-bar {
    height: 28px;
    background: #f7f8fa;
    border-bottom: 1px solid #e5e8ee;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 12px;
    color: #1a1a1a;
    flex-shrink: 0;
  }
  .status-icons { display: flex; align-items: center; gap: 5px; }
  .status-icons svg { display: block; }

  /* ========== 导航栏（单行，随页面变化） ========== */
  .nav-bar {
    height: 42px;
    background: #f7f8fa;
    border-bottom: 1px solid #e5e8ee;
    display: flex;
    align-items: center;
    padding: 0 10px;
    flex-shrink: 0;
    position: relative;
  }
  .nav-left {
    width: 62px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }
  .nav-back-btn {
    border: none; background: none;
    font-size: 13px; color: #2b5db8;
    cursor: pointer; padding: 4px 0;
  }
  .nav-back-btn:hover { color: #234d9c; }
  .nav-title {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    letter-spacing: .5px;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nav-actions { display: none; gap: 6px; margin-left: auto; margin-right: 8px; }
  .mini-btn {
    height: 22px;
    padding: 0 7px;
    font-size: 11px;
    border: 1px solid #b8cbe8;
    background: #fff;
    color: #2b5db8;
    border-radius: 3px;
    cursor: pointer;
  }
  .mini-btn:hover { background: #eaf1fb; }
  /* 微信小程序胶囊按钮 */
  .capsule {
    display: flex;
    align-items: center;
    background: #fff;
    border: 1px solid #e2e5ea;
    border-radius: 15px;
    height: 28px;
    overflow: hidden;
    flex-shrink: 0;
    margin-left: auto;
  }
  .capsule-btn {
    width: 38px; height: 100%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    background: transparent;
    border: none;
  }
  .capsule-btn:hover { background: #f0f2f5; }
  .capsule-divider { width: 1px; height: 15px; background: #e2e5ea; }

  /* ========== 内容区 ========== */
  .content {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: #f2f4f7;
  }
  .page {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .page.active { display: flex; }

  /* 未登录提示 */
  .nologin-tip {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #8a93a3;
    font-size: 13px;
    padding: 40px 0;
  }
  .nologin-tip .icon { font-size: 34px; opacity: .45; }

  /* ========== 聊天区 ========== */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: #ccd3dd; border-radius: 2px; }

  .chat-date {
    text-align: center;
    font-size: 10px;
    color: #9aa3b0;
    margin: 2px 0 8px;
  }
  .msg-row { display: flex; margin-bottom: 10px; gap: 8px; }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar {
    width: 28px; height: 28px;
    border-radius: 4px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    color: #fff;
  }
  .avatar.ai { background: #2b5db8; font-weight: 600; }
  .avatar.me { background: #5a8f5a; }
  .msg-body { max-width: 74%; display: flex; flex-direction: column; }
  .msg-row.user .msg-body { align-items: flex-end; }
  .msg-name { font-size: 10px; color: #9aa3b0; margin-bottom: 3px; }
  .bubble {
    padding: 6px 9px;
    font-size: 12px;
    line-height: 1.6;
    border-radius: 4px;
    word-break: break-all;
    white-space: pre-wrap;
  }
  .msg-row.ai .bubble { background: #fff; border: 1px solid #e2e6ec; color: #2b2f36; border-top-left-radius: 0; }
  .msg-row.user .bubble { background: #2b5db8; color: #fff; border-top-right-radius: 0; }

  /* 输入区 */
  .input-bar {
    flex-shrink: 0;
    background: #f7f8fa;
    border-top: 1px solid #e2e6ec;
    padding: 7px 10px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .input-bar input {
    flex: 1;
    height: 28px;
    border: 1px solid #d0d6df;
    border-radius: 3px;
    background: #fff;
    padding: 0 8px;
    font-size: 12px;
    outline: none;
  }
  .input-bar input:focus { border-color: #2b5db8; }
  .input-bar input:disabled { background: #eef0f4; color: #a8b0bc; }
  .send-btn {
    height: 28px;
    padding: 0 13px;
    background: #2b5db8;
    color: #fff;
    border: none;
    border-radius: 3px;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 2px;
  }
  .send-btn:hover { background: #234d9c; }
  .send-btn:disabled { background: #a9b8d0; cursor: default; }

  /* 语音按钮 */
  .voice-btn {
    width: 28px; height: 28px;
    flex-shrink: 0;
    border: 1px solid #d0d6df;
    border-radius: 3px;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .voice-btn:hover { background: #eef3fb; }
  .voice-btn:disabled { background: #eef0f4; cursor: default; }
  /* 语音消息气泡 */
  .voice-box {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-width: 58px;
  }
  .voice-box .vplay {
    width: 16px; height: 16px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
  }
  .voice-box .vdur { font-size: 11px; }
  .msg-row.user .voice-box .vdur { color: #fff; }

  /* ========== 在线咨询列表 ========== */
  .consult-list { flex: 1; overflow-y: auto; padding: 7px 9px; }
  .section-label {
    font-size: 11px;
    color: #8a93a3;
    margin: 5px 2px;
    letter-spacing: 1px;
  }
  .session-item {
    background: #fff;
    border: 1px solid #e2e6ec;
    border-radius: 4px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .session-item:hover { border-color: #b8cbe8; background: #fbfcff; }
  .session-avatar {
    width: 34px; height: 34px;
    border-radius: 4px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 600;
  }
  .session-info { flex: 1; min-width: 0; }
  .session-top { display: flex; align-items: center; gap: 6px; }
  .session-name { font-size: 13px; font-weight: 600; color: #2b2f36; }
  .session-tag {
    font-size: 9px;
    color: #2b5db8;
    border: 1px solid #a9c3e8;
    border-radius: 2px;
    padding: 0 3px;
    line-height: 14px;
  }
  .session-msg { font-size: 11px; color: #8a93a3; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .session-time { font-size: 10px; color: #b0b8c4; }
  .badge {
    min-width: 16px; height: 16px;
    background: #e34d4d;
    color: #fff;
    border-radius: 8px;
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px;
  }

  /* 子页面（客服/群聊） */
  .group-page { display: none; flex-direction: column; position: absolute; inset: 0; background: #f2f4f7; z-index: 5; }
  .group-page.active { display: flex; }

  /* 群内子标签栏（导航栏下方） */
  .group-tabs {
    height: 34px;
    flex-shrink: 0;
    background: #fff;
    border-bottom: 1px solid #e2e6ec;
    display: flex;
  }
  .group-tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #7a8494;
    cursor: pointer;
    position: relative;
  }
  .group-tab:hover { color: #4a5568; }
  .group-tab.active { color: #2b5db8; font-weight: 600; }
  .group-tab.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 22px; height: 2px;
    background: #2b5db8;
    border-radius: 1px;
  }
  .group-tab-pane {
    display: none;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
  }
  .group-tab-pane.active { display: flex; }

  /* 群公告 */
  .notice-list { flex: 1; overflow-y: auto; padding: 8px 10px; }
  .notice-card {
    background: #fff;
    border: 1px solid #e2e6ec;
    border-radius: 4px;
    padding: 9px 11px;
    margin-bottom: 8px;
  }
  .notice-card.current { border-color: #b8cbe8; background: #f5f9ff; }
  .notice-head { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .notice-flag {
    font-size: 9px; color: #fff; background: #2b5db8;
    border-radius: 2px; padding: 0 4px; line-height: 14px;
  }
  .notice-date { font-size: 10px; color: #9aa3b0; margin-left: auto; }
  .notice-title { font-size: 12px; font-weight: 600; color: #2b2f36; margin-bottom: 3px; }
  .notice-text { font-size: 11px; color: #5a6270; line-height: 1.6; }

  /* 群成员（仅姓名 + 管理员标签） */
  .member-list2 { flex: 1; overflow-y: auto; background: #fff; }
  .member-row2 {
    display: flex; align-items: center;
    padding: 9px 12px;
    border-bottom: 1px solid #f2f4f7;
    font-size: 12px;
    color: #2b2f36;
  }
  .member-tag2 {
    margin-left: auto;
    font-size: 9px; color: #2b5db8;
    border: 1px solid #a9c3e8; border-radius: 2px;
    padding: 0 4px; line-height: 15px;
    flex-shrink: 0;
  }

  /* 群文件（名称/大小/上传人/上传时间/下载） */
  .gfile-list2 { flex: 1; overflow-y: auto; padding: 7px 9px; }
  .gfile-card2 {
    background: #fff; border: 1px solid #e2e6ec; border-radius: 4px;
    padding: 8px 10px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 10px;
  }
  .gfile-icon2 {
    width: 30px; height: 30px; border-radius: 4px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #fff;
  }
  .gfile-info2 { flex: 1; min-width: 0; }
  .gfile-name2 { font-size: 12px; color: #2b2f36; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gfile-sub2 { font-size: 10px; color: #9aa3b0; margin-top: 2px; }

  /* ========== 文件下载 ========== */
  .file-list { flex: 1; overflow-y: auto; padding: 7px 9px; }
  .file-item {
    background: #fff;
    border: 1px solid #e2e6ec;
    border-radius: 4px;
    padding: 8px 10px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .file-icon {
    width: 32px; height: 32px;
    border-radius: 4px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
  }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-size: 12px; font-weight: 600; color: #2b2f36; display: flex; align-items: center; gap: 5px; }
  .file-name > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-desc { font-size: 10px; color: #8a93a3; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { font-size: 10px; color: #9aa3b0; margin-top: 2px; }
  .file-dl {
    flex-shrink: 0;
    height: 25px;
    padding: 0 4px;
    background: transparent;
    color: #2b5db8;
    border: none;
    font-size: 11px;
    cursor: pointer;
  }
  .file-dl:hover { color: #234d9c; }
  .file-dl:disabled { color: #a8b0bc; cursor: default; }

  /* ========== 对话工具栏（新建/历史） ========== */
  .chat-toolbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    background: #eef2f8;
    border-bottom: 1px solid #e2e6ec;
  }
  .tool-btn {
    height: 24px;
    padding: 0 9px;
    font-size: 11px;
    border: 1px solid #b8cbe8;
    background: #fff;
    color: #2b5db8;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tool-btn:hover { background: #eaf1fb; }
  .tool-btn:disabled { background: #f1f3f6; color: #a8b0bc; border-color: #e2e6ec; cursor: default; }

  /* ========== 历史对话记录面板 ========== */
  .hist-overlay {
    position: absolute;
    top: 28px; right: 0; bottom: 48px; left: 0;
    background: rgba(20,30,45,.35);
    z-index: 30;
    display: flex;
    align-items: stretch;
    justify-content: flex-start;
    opacity: 0; visibility: hidden;
    transition: opacity .25s ease;
  }
  .hist-overlay.active { opacity: 1; visibility: visible; }
  .hist-panel {
    width: 66.67%;
    height: 100%;
    background: #fff;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 2px 0 12px rgba(30,60,110,.18);
    transform: translateX(-100%);
    transition: transform .25s ease;
  }
  .hist-overlay.active .hist-panel { transform: translateX(0); }
  .hist-head {
    height: 38px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    border-bottom: 1px solid #eef1f5;
    font-size: 13px;
    font-weight: 600;
    color: #2b2f36;
  }
  .hist-close { border: none; background: none; cursor: pointer; color: #8a93a3; font-size: 15px; }
  .hist-close:hover { color: #4a5568; }
  .hist-body { flex: 1; overflow-y: auto; padding: 8px 10px; }
  .hist-item {
    background: #f7f8fa;
    border: 1px solid #e2e6ec;
    border-radius: 4px;
    padding: 7px 10px;
    margin-bottom: 7px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .hist-item:hover { background: #eef3fb; border-color: #b8cbe8; }
  .hist-item-main { flex: 1; min-width: 0; }
  .hist-item-title { font-size: 12px; font-weight: 600; color: #2b2f36; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-item-time { font-size: 10px; color: #9aa3b0; margin-top: 3px; }
  .hist-del-btn {
    height: 22px; padding: 0 10px; font-size: 11px; flex-shrink: 0;
    background: #fff; color: #c9403f; border: 1px solid #d9a0a0; border-radius: 3px; cursor: pointer;
  }
  .hist-del-btn:hover { background: #fdf3f3; }

  /* ========== 我的页面 ========== */
  .mine-body { flex: 1; overflow-y: auto; padding: 12px 10px; }
  .info-card {
    background: #fff;
    border: 1px solid #e2e6ec;
    border-radius: 4px;
    overflow: hidden;
  }
  .info-row {
    display: flex;
    padding: 10px 12px;
    border-bottom: 1px solid #f2f4f7;
    font-size: 12px;
    align-items: center;
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { width: 56px; color: #8a93a3; flex-shrink: 0; }
  .info-value { color: #2b2f36; }
  .logout-btn {
    width: 100%;
    margin-top: 16px;
    height: 33px;
    background: #fff;
    border: 1px solid #d9a0a0;
    color: #c9403f;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 4px;
  }
  .logout-btn:hover { background: #fdf3f3; }

  /* ========== 底部标签栏 ========== */
  .tab-bar {
    flex-shrink: 0;
    height: 48px;
    background: #fbfcfd;
    border-top: 1px solid #dfe3ea;
    display: flex;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    color: #7a8494;
    position: relative;
    font-size: 10px;
  }
  .tab-item svg { display: block; }
  .tab-item.active { color: #2b5db8; }
  .tab-item .tab-badge {
    position: absolute;
    top: 3px; right: 22%;
    min-width: 14px; height: 14px;
    background: #e34d4d;
    color: #fff;
    border-radius: 7px;
    font-size: 9px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 3px;
  }

  /* Toast */
  .toast {
    position: absolute;
    left: 50%; top: 45%;
    transform: translateX(-50%);
    background: rgba(20,30,45,.82);
    color: #fff;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 4px;
    z-index: 99;
    display: none;
    max-width: 80%;
    text-align: center;
  }
</style>
</head>
<body>

<div class="phone">
  <!-- 状态栏 -->
  <div class="status-bar">
    <span id="statusTime">14:08</span>
    <div class="status-icons">
      <svg width="16" height="11" viewBox="0 0 16 11" fill="#1a1a1a">
        <rect x="0" y="7" width="3" height="4" rx="0.5"/>
        <rect x="4.3" y="5" width="3" height="6" rx="0.5"/>
        <rect x="8.6" y="2.5" width="3" height="8.5" rx="0.5"/>
        <rect x="12.9" y="0" width="3" height="11" rx="0.5" opacity="0.35"/>
      </svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="#1a1a1a">
        <path d="M7.5 9.2 L9.3 7.1 A2.9 2.9 0 0 0 5.7 7.1 Z"/>
        <path d="M3.6 5.1 A5.9 5.9 0 0 1 11.4 5.1 L10.2 6.4 A4.2 4.2 0 0 0 4.8 6.4 Z" opacity="0.9"/>
        <path d="M1.4 2.8 A9 9 0 0 1 13.6 2.8 L12.4 4.1 A7.3 7.3 0 0 0 2.6 4.1 Z" opacity="0.9"/>
      </svg>
      <svg width="23" height="11" viewBox="0 0 24 11">
        <rect x="0.5" y="0.5" width="20" height="10" rx="2.5" fill="none" stroke="#1a1a1a" stroke-opacity="0.4"/>
        <rect x="2" y="2" width="14" height="7" rx="1.2" fill="#1a1a1a"/>
        <rect x="21.8" y="3.5" width="1.8" height="4" rx="0.9" fill="#1a1a1a" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- 导航栏（单行，标题与左侧图标随页面变化） -->
  <div class="nav-bar">
    <div class="nav-left" id="navLeft">
      <button class="nav-back-btn" id="btnBack" style="display:none">‹ 返回</button>
    </div>
    <div class="nav-title" id="navTitle">AI工作窗口</div>
    <div class="capsule">
      <button class="capsule-btn" id="btnShare" title="分享">
        <svg width="18" height="4" viewBox="0 0 18 4" fill="#1a1a1a">
          <circle cx="2" cy="2" r="1.7"/><circle cx="9" cy="2" r="1.7"/><circle cx="16" cy="2" r="1.7"/>
        </svg>
      </button>
      <div class="capsule-divider"></div>
      <button class="capsule-btn" id="btnClose" title="关闭">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="#1a1a1a" stroke-width="1.5">
          <circle cx="7.5" cy="7.5" r="6.2"/>
          <circle cx="7.5" cy="7.5" r="2.4" fill="#1a1a1a" stroke="none"/>

<script>
/* ================= 基础状态 ================= */
var loggedIn = true;
var currentPage = 'ai';
var lastTab = 'ai';
var currentGroup = -1;
var titles = {
  ai: 'AI工作窗口',
  consult: '在线咨询',
  files: '文件下载',
  direct: '在线客服',
  mine: '我的'
};
var TAB_KEYS = ['ai', 'consult', 'files', 'mine'];

/* ================= 状态栏时间 ================= */
function updateTime() {
  var d = new Date();
  document.getElementById('statusTime').textContent =
    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
updateTime();
setInterval(updateTime, 10000);

/* ================= Toast ================= */
var toastTimer = null;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, 1800);
}

/* ================= 导航栏（随页面变化） ================= */
function renderNav() {
  var back = document.getElementById('btnBack');
  var title = document.getElementById('navTitle');
  var isTab = TAB_KEYS.indexOf(currentPage) >= 0;
  back.style.display = isTab ? 'none' : 'block';
  if (currentPage === 'group' && currentGroup >= 0) {
    title.textContent = groups[currentGroup].name;
  } else {
    title.textContent = titles[currentPage] || 'AI工作窗口';
  }
}
function goBack() {
  if (currentPage === 'direct' || currentPage === 'group') {
    closeChat(currentPage === 'direct' ? 'directChat' : 'groupChat');
    closeDrawers();
    currentPage = 'consult';
    renderNav();
  }
}

/* ================= 标签切换 ================= */
function switchTab(key, el) {
  if (!loggedIn) {
    toast('未登录，暂无法使用该功能');
    return;
  }
  document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
  document.getElementById('page-' + key).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(function (t) { t.classList.remove('active'); });
  if (el) el.classList.add('active');
  currentPage = key;
  lastTab = key;
  // 关闭咨询内部页面
  closeChat('directChat');
  closeChat('groupChat');
  closeDrawers();
  renderNav();
}

/* ================= 聊天通用 ================= */
function addMsg(containerId, role, name, text, avatarText, avatarColor) {
  var box = document.getElementById(containerId);
  var row = document.createElement('div');
  row.className = 'msg-row ' + role;
  var av = document.createElement('div');
  av.className = 'avatar ' + (role === 'user' ? 'me' : 'ai');
  if (avatarColor) av.style.background = avatarColor;
  av.textContent = avatarText || (role === 'user' ? '我' : '助');
  var body = document.createElement('div');
  body.className = 'msg-body';
  var nameEl = document.createElement('div');
  nameEl.className = 'msg-name';
  nameEl.textContent = name;
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  body.appendChild(nameEl);
  body.appendChild(bubble);
  row.appendChild(av);
  row.appendChild(body);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

/* ================= 多轮对话（会话 / 历史记录） ================= */
var chatSessions = { ai: [] };   // 历史对话列表（每个元素为一轮完整对话）
var activeSession = { ai: null }; // 当前激活会话

function nowHM() {
  var d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function nowLabel() {
  var d = new Date();
  var p = function (n) { return String(n).padStart(2, '0'); };
  return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
/* 新建一个会话对象（含系统欢迎语） */
function newSessionObj(type) {
  return {
    id: 's_' + type + '_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    type: type,
    title: '新对话',
    time: nowLabel(),
    messages: [{ role: 'ai', name: '工资系统AI助手', text: '您好！我是工资系统AI助手，请问有什么可以帮您？您可以直接输入问题，例如"如何查询上月工资条"。', avatar: '助', color: '#2b5db8' }]
  };
}
function renderMsg(containerId, m) {
  addMsg(containerId, m.role, m.name, m.text, m.avatar, m.color);
}
/* 将当前激活会话渲染进聊天区 */
function renderActiveSession(type) {
  var containerId = 'chatAI';
  var box = document.getElementById(containerId);
  box.innerHTML = '';
  var d = document.createElement('div');
  d.className = 'chat-date';
  d.textContent = activeSession[type] ? activeSession[type].time : '';
  box.appendChild(d);
  (activeSession[type].messages || []).forEach(function (m) { renderMsg(containerId, m); });
}
/* 初始化页面空会话 */
function initSessions() {
  activeSession.ai = newSessionObj('ai');
  renderActiveSession('ai');
}
/* 新建对话：当前会话若有内容则存入历史，再开新会话 */
function newChat(type) {
  if (!loggedIn) { toast('未登录，暂无法使用该功能'); return; }
  var cur = activeSession[type];
  var hasUser = cur.messages.some(function (m) { return m.role === 'user'; });
  if (hasUser) chatSessions[type].unshift(cur);
  activeSession[type] = newSessionObj(type);
  renderActiveSession(type);
  toast('已新建对话，原对话已存入历史');
}
/* 打开历史面板 */
function openHistory(type) {
  if (!loggedIn) { toast('未登录，暂无法使用该功能'); return; }
  renderHistoryList(type);
  document.getElementById('histOverlay').classList.add('active');
}
function closeHistory() {
  document.getElementById('histOverlay').classList.remove('active');
}
/* 渲染历史列表 */
function renderHistoryList(type) {
  var body = document.getElementById('histBody');
  body.innerHTML = '';
  document.getElementById('histTitle').textContent = '历史对话';
  var list = chatSessions[type];
  if (!list.length) {
    var empty = document.createElement('div');
    empty.className = 'nologin-tip';
    empty.innerHTML = '<div class="icon">🗒️</div><div>暂无历史对话记录</div>';
    body.appendChild(empty);
    return;
  }
  list.forEach(function (sess) {
    var card = document.createElement('div');
    card.className = 'hist-item';
    card.onclick = function () { loadSession(type, sess.id); };
    var main = document.createElement('div');
    main.className = 'hist-item-main';
    var t = document.createElement('div');
    t.className = 'hist-item-title';
    t.textContent = truncateTitle(sess.title || '对话记录', 15);
    var time = document.createElement('div');
    time.className = 'hist-item-time';
    time.textContent = sess.time;
    main.appendChild(t); main.appendChild(time);
    var delBtn = document.createElement('button');
    delBtn.className = 'hist-del-btn';
    delBtn.textContent = '删除';
    delBtn.onclick = function (e) {
      e.stopPropagation();
      deleteSession(type, sess.id);
    };
    card.appendChild(main); card.appendChild(delBtn);
    body.appendChild(card);
  });
}
/* 标题超长截断：最多 max 字，超出以 … 结尾 */
function truncateTitle(s, max) {
  var chars = Array.from(s);
  if (chars.length <= max) return s;
  return chars.slice(0, max).join('') + '...';
}
/* 载入某条历史会话（当前会话若有内容先存回历史） */
function loadSession(type, id) {
  var sess = null;
  for (var i = 0; i < chatSessions[type].length; i++) {
    if (chatSessions[type][i].id === id) { sess = chatSessions[type][i]; break; }
  }
  if (!sess) return;
  var cur = activeSession[type];
  var hasUser = cur.messages.some(function (m) { return m.role === 'user'; });
  if (hasUser) chatSessions[type].unshift(cur);
  chatSessions[type] = chatSessions[type].filter(function (s) { return s.id !== id; });
  activeSession[type] = sess;
  renderActiveSession(type);
  closeHistory();
  toast('已载入历史对话');
}
/* 删除某条历史会话 */
function deleteSession(type, id) {
  chatSessions[type] = chatSessions[type].filter(function (s) { return s.id !== id; });
  renderHistoryList(type);
  toast('已删除该历史对话');
}

function openDirectChat() {
  if (!loggedIn) { toast('未登录，暂无法使用该功能'); return; }
  clearBadge('badgeKefu');
  document.getElementById('directChat').classList.add('active');
  currentPage = 'direct';
  renderNav();
}
function openGroup(i) {
  if (!loggedIn) { toast('未登录，暂无法使用该功能'); return; }
  currentGroup = i;
  clearBadge('badgeGroup' + i);
  var box = document.getElementById('chatGroup');
  box.innerHTML = '';
  groups[i].msgs.forEach(function (m) {
    addGroupMsg('other', m.name, m.text, m.color);
  });
  renderMembers2();
  renderGfiles2();
  renderNotices();
  switchGroupTab('chat');
  document.getElementById('groupChat').classList.add('active');
  currentPage = 'group';
  renderNav();
}
function closeChat(id) {
  var el = document.getElementById(id);
  if (el) el.classList.remove('active');
}
function addGroupMsg(role, name, text, color) {
  var row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'ai');
  var av = document.createElement('div');
  av.className = 'avatar';
  av.style.background = role === 'user' ? '#5a8f5a' : color;
  av.textContent = name.charAt(0);
  var body = document.createElement('div');
  body.className = 'msg-body';
  var nameEl = document.createElement('div');
  nameEl.className = 'msg-name';
  nameEl.textContent = name;
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  body.appendChild(nameEl);
  body.appendChild(bubble);
  row.appendChild(av);
  row.appendChild(body);
  var box = document.getElementById('chatGroup');
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

function sendDirect() {
  if (!loggedIn) { toast('未登录，无法发送消息'); return; }
  var input = document.getElementById('inputDirect');
  var text = input.value.trim();
  if (!text) return;
  addMsg('chatDirect', 'user', '我', text, '我');
  input.value = '';
  setTimeout(function () {
    addMsg('chatDirect', 'ai', '在线客服', '收到您的问题，正在为您核实处理，请稍候。', '客', '#3a7d44');
  }, 600);
}
function sendGroup() {
  if (!loggedIn) { toast('未登录，无法发送消息'); return; }
  if (currentGroup < 0) return;
  var input = document.getElementById('inputGroup');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  addGroupMsg('user', '我', text, '');
  var g = groups[currentGroup];
  var responder = g.members[Math.floor(Math.random() * g.members.length)];
  setTimeout(function () {
    var m = { name: responder.name, color: responder.color, text: '收到，已记录您反馈的问题。' };
    g.msgs.push(m);
    addGroupMsg('other', m.name, m.text, m.color);
  }, 800);
}

/* 群内子标签切换 */
function switchGroupTab(which) {
  ['chat', 'notice', 'members', 'files'].forEach(function (k) {
    var pane = document.getElementById('gt-' + k);
    if (pane) pane.classList.toggle('active', k === which);
  });
  document.querySelectorAll('#groupChat .group-tab').forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-gt') === which);
  });
}

/* 群成员（仅姓名 + 管理员标签，含多管理员；不显示单位/科室） */
function cleanMemberName(n) {
  // 去掉括号中的单位/科室描述
  var s = n.replace(/（[^）]*）/g, '').replace(/\([^)]*\)/g, '');
  // 去掉“单位-姓名”中的单位部分
  if (s.indexOf('-') >= 0) { s = s.split('-').pop(); }
  return s;
}
function renderMembers2() {
  var box = document.getElementById('memberList2');
  box.innerHTML = '';
  groups[currentGroup].members.forEach(function (m) {
    var row = document.createElement('div');
    row.className = 'member-row2';
    var nm = document.createElement('span');
    nm.textContent = cleanMemberName(m.name);
    row.appendChild(nm);
    if (m.role === 'admin') {
      var tag = document.createElement('span');
      tag.className = 'member-tag2';
      tag.textContent = '管理员';
      row.appendChild(tag);
    }
    box.appendChild(row);
  });
}

/* 群文件（名称/大小/上传人/上传时间/下载） */
function renderGfiles2() {
  var box = document.getElementById('gfileList2');
  box.innerHTML = '';
  groups[currentGroup].files.forEach(function (f) {
    var card = document.createElement('div');
    card.className = 'gfile-card2';

    var icon = document.createElement('div');
    icon.className = 'gfile-icon2';
    icon.style.background = typeColors[ext] || '#6b7280';
    icon.textContent = ext;

    info.className = 'gfile-info2';

    n.className = 'gfile-name2';
    n.textContent = f.name;
    var s = document.createElement('div');
    s.className = 'gfile-sub2';
    s.textContent = f.size + ' · 上传人：' + f.by + ' · ' + f.time;

    btn.textContent = '下载';

    };
    card.appendChild(icon);
    card.appendChild(info);
    card.appendChild(btn);
    box.appendChild(card);
  });
}

/* 群公告（当前 + 历史） */
function renderNotices() {
  var box = document.getElementById('noticeList');
  box.innerHTML = '';
  groups[currentGroup].announcements.forEach(function (a) {
    var card = document.createElement('div');
    card.className = 'notice-card' + (a.current ? ' current' : '');

/* 语音消息气泡 */
function addVoiceMsg(containerId, role, name, dur, color) {
  var box = document.getElementById(containerId);
  var row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'ai');
  var av = document.createElement('div');
  av.className = 'avatar ' + (role === 'user' ? 'me' : 'ai');
  if (color) av.style.background = color;
  av.textContent = role === 'user' ? '我' : (name ? name.charAt(0) : '助');
  var body = document.createElement('div');
  body.className = 'msg-body';
  var nameEl = document.createElement('div');
  nameEl.className = 'msg-name';
  nameEl.textContent = name;
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  var vb = document.createElement('div');
  vb.className = 'voice-box';
  vb.innerHTML = '<span class="vplay">▶</span><span class="vdur">' + dur + '″</span>';
  bubble.appendChild(vb);
  body.appendChild(nameEl);
  body.appendChild(bubble);
  row.appendChild(av);
  row.appendChild(body);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}
function randDur() { return Math.floor(Math.random() * 4) + 2; }
function sendVoiceDirect() {
  if (!loggedIn) { toast('未登录，无法发送消息'); return; }
  addVoiceMsg('chatDirect', 'user', '我', randDur());
  setTimeout(function () {
    addVoiceMsg('chatDirect', 'ai', '在线客服', randDur(), '#3a7d44');
  }, 700);
}
function sendVoiceGroup() {
  if (!loggedIn) { toast('未登录，无法发送消息'); return; }
  if (currentGroup < 0) return;
  addVoiceMsg('chatGroup', 'user', '我', randDur());
  var g = groups[currentGroup];
  var responder = g.members[Math.floor(Math.random() * g.members.length)];
  setTimeout(function () {
    addVoiceMsg('chatGroup', 'other', responder.name, randDur(), responder.color);
  }, 800);
}

}

/* 未读徽标处理 */
var tabConsultUnread = 6;
function clearBadge(id) {
  var b = document.getElementById(id);
  if (!b) return;
  var n = parseInt(b.textContent, 10) || 0;
  if (n > 0 && tabConsultUnread > 0) tabConsultUnread = Math.max(0, tabConsultUnread - n);
  b.remove();
  var tabB = document.getElementById('tabBadgeConsult');
  if (tabB) {
    if (tabConsultUnread > 0) tabB.textContent = tabConsultUnread;
    else tabB.remove();
  }
}

var typeColors = { PDF: '#c9403f', XLSX: '#3a7d44', DOCX: '#2b5db8', ZIP: '#8a6d3b' };
function renderFiles() {
  var box = document.getElementById('fileList');

/* ================= 我的 ================= */
function logout() {
  loggedIn = false;
  document.getElementById('settingsLoggedIn').style.display = 'none';
  document.getElementById('settingsLoggedOut').style.display = 'block';
  // 回到AI工作窗口
  document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
  document.getElementById('page-ai').classList.add('active');
  document.querySelectorAll('.tab-item').forEach(function (t) { t.classList.remove('active'); });
  document.querySelector('.tab-item[data-page="ai"]').classList.add('active');
  currentPage = 'ai';
  lastTab = 'ai';
  currentGroup = -1;
  closeChat('directChat');
  closeChat('groupChat');
  closeDrawers();
  renderNav();
  // 禁止发送消息：输入框与发送按钮全部禁用
  ['inputAI', 'inputDirect', 'inputGroup'].forEach(function (id) {
    var el = document.getElementById(id);
    el.value = '';
    el.disabled = true;
    el.placeholder = '未登录，无法发送消息';
  });
  ['sendAI', 'sendDirect', 'sendGroup', 'voiceDirect', 'voiceGroup'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.disabled = true;
  });
  // 禁用对话管理工具栏按钮
  ['newChatAI', 'histAI'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.disabled = true;
  });
  // 聊天区清空并显示未登录提示
  ['chatAI', 'chatDirect'].forEach(function (id) {
    document.getElementById(id).innerHTML = '';
  });
  document.getElementById('chatGroup').innerHTML = '';
  showNologinInChats();
  // 禁止下载：所有下载按钮禁用
  document.querySelectorAll('#fileList .file-dl').forEach(function (b) { b.disabled = true; });
  document.querySelectorAll('#gfileList2 .file-dl').forEach(function (b) { b.disabled = true; });
  // 清除未读徽标
  tabConsultUnread = 0;
  var tabB = document.getElementById('tabBadgeConsult');
  if (tabB) tabB.remove();
  document.querySelectorAll('.badge').forEach(function (b) { b.remove(); });
  toast('已退出登录');
}
function showNologinInChats() {
  ['chatAI', 'chatDirect'].forEach(function (id) {
    var tip = document.createElement('div');
    tip.className = 'nologin-tip';
    tip.innerHTML = '<div class="icon">🔒</div><div>当前未登录，暂无法使用该功能</div>';
    document.getElementById(id).appendChild(tip);
  });
}
