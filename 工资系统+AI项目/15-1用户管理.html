<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>用户管理 · 智能维护管理</title>
<style>
/* ===================================================================
   Design Tokens
   =================================================================== */
:root {
  /* Surfaces */
  --page-bg:        #e9edfa;
  --shell-bg:       #f7f9fd;
  --surface:        #ffffff;
  --surface-soft:   #fafbfe;
  --thead-bg:       #e8ebf7;
  --row-hover:      #f1f5ff;

  /* Sidebar */
  --sb-top:         #242c41;
  --sb-bottom:      #1e2537;
  --sb-active:      #3a4257;
  --sb-text:        #c9d0e0;
  --sb-text-muted:  #a7b0c3;
  --sb-icon:        #9aa4ba;
  --sb-divider:     rgba(255,255,255,.065);

  /* Brand / Action */
  --brand:          #1e2a6b;
  --brand-hover:    #27367f;
  --brand-logo-a:   #4b58d6;
  --brand-logo-b:   #7568e9;
  --link:           #33489f;
  --link-hover:     #1f3180;

  /* Ink */
  --ink-strong:     #2b3550;
  --ink:            #5c6579;
  --ink-soft:       #7c8699;
  --ink-muted:      #98a1b2;
  --ink-placeholder:#a9b1c0;

  /* Lines */
  --line:           #e4e9f3;
  --line-soft:      #edf1f8;
  --field-line:     #e1e6f0;

  /* Semantic */
  --green:          #4fa72b;
  --green-line:     #8edb5c;
  --green-bg:       #fbfff7;
  --red:            #d4655f;
  --red-line:       #efaaa6;
  --red-bg:         #fff8f7;
  --amber:          #96600d;   /* 待审核：与「通过 / 驳回」构成三态 */
  --amber-line:     #eed39c;
  --amber-bg:       #fffbf2;

  /* Effects */
  --radius-shell:   18px;
  --radius-card:    10px;
  --radius-ctrl:    4px;
  --shadow-shell:   0 12px 40px rgba(62,72,126,.16), 0 0 0 1px rgba(122,134,190,.16);
  --shadow-card:    0 2px 10px rgba(48,60,110,.05);
  --shadow-pop:     0 8px 26px rgba(28,40,80,.18);
  --focus-ring:     0 0 0 2px rgba(80,105,210,.12);
  --ease:           160ms ease;

  /* Type */
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Inter", sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 12.5px;
  color: var(--ink);
  background: linear-gradient(135deg, #e9edfb 0%, #f3f5fc 46%, #dfe2f2 100%);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}
button, input, select { font-family: inherit; }
button { cursor: pointer; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ic {
  width: 16px; height: 16px; flex: 0 0 auto;
  fill: none; stroke: currentColor; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round;
}
:focus-visible { outline: 2px solid #7b8ede; outline-offset: 2px; }

/* ===================================================================
   Shell
   =================================================================== */
.shell {
  height: calc(100vh - 24px);
  margin: 12px;
  display: flex;
  background: var(--shell-bg);
  border-radius: var(--radius-shell);
  box-shadow: var(--shadow-shell);
  overflow: hidden;
}

/* --------------------------- Sidebar --------------------------- */
.sidebar {
  width: 176px;                 /* 220px − 20% */
  flex: 0 0 176px;
  margin: 2px 0 2px 2px;
  border-radius: 16px;
  background: linear-gradient(180deg, var(--sb-top), var(--sb-bottom));
  color: var(--sb-text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width var(--ease), flex-basis var(--ease);
}
.brand {
  height: 66px; flex: 0 0 66px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px;
  border-bottom: 1px solid var(--sb-divider);
  white-space: nowrap;
}
.brand .logo {
  width: 34px; height: 34px; flex: 0 0 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--brand-logo-a), var(--brand-logo-b));
  display: grid; place-items: center;
  color: #fff;
  box-shadow: 0 4px 12px rgba(75,88,214,.38);
}
.brand .logo .ic { width: 18px; height: 18px; stroke-width: 1.8; }
.brand .name { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: .3px; }

.nav { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 10px 16px; }
.nav::-webkit-scrollbar { width: 5px; }
.nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 4px; }
.nav-group { margin-bottom: 4px; }
.nav-item {
  height: 40px; display: flex; align-items: center; gap: 10px;
  padding: 0 10px; border-radius: 6px;
  font-size: 13px; color: var(--sb-text);
  cursor: pointer; user-select: none; white-space: nowrap;
  transition: background var(--ease), color var(--ease);
}
.nav-item:hover { background: rgba(255,255,255,.05); }
.nav-item .ic { color: var(--sb-icon); }
.nav-item .caret { width: 12px; height: 12px; margin-left: auto; color: #8b95ab; transition: transform var(--ease); }
.nav-item.open .caret { transform: rotate(180deg); }
.nav-children { padding: 2px 0 6px; }
.nav-children.is-hidden { display: none; }
.nav-child {
  height: 36px; display: flex; align-items: center; gap: 10px;
  padding: 0 10px 0 26px; margin: 1px 0;
  border-radius: 6px;
  font-size: 12.5px; color: var(--sb-text-muted);
  cursor: pointer; user-select: none; white-space: nowrap;
  transition: background var(--ease), color var(--ease);
}
.nav-child .ic { width: 14px; height: 14px; color: #8892a8; }
.nav-child:hover { color: #fff; background: rgba(255,255,255,.045); }
.nav-child.active { background: var(--sb-active); color: #fff; font-weight: 500; }
.nav-child.active .ic { color: #dbe1f0; }

.shell.collapsed .sidebar { width: 51px; flex-basis: 51px; }
.shell.collapsed .brand { justify-content: center; padding: 0; }
.shell.collapsed .brand .name,
.shell.collapsed .nav-item .txt,
.shell.collapsed .nav-item .caret,
.shell.collapsed .nav-children { display: none; }
.shell.collapsed .nav-item { justify-content: center; padding: 0; }
.shell.collapsed .nav { padding-left: 10px; padding-right: 10px; }

/* --------------------------- Topbar --------------------------- */
.workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 62px; flex: 0 0 62px;
  margin: 2px 12px 0 14px; padding: 0 22px;
  background: var(--surface);
  border-radius: 10px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 1px 3px rgba(40,50,90,.04);
}
.icon-btn {
  width: 26px; height: 26px; display: grid; place-items: center;
  border: 0; background: transparent; border-radius: 5px;
  color: #7b869c; padding: 0;
}
.icon-btn:hover { background: #f1f4fb; color: var(--brand); }
.icon-btn .ic { width: 15px; height: 15px; }
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #8a93a7; }
.crumbs .sep { color: #c2c9d7; }
.crumbs .current { color: #46516a; }
.topbar-spacer { flex: 1; }
.topbar-user {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; color: #46516a;
  padding: 5px 8px; border-radius: 20px; cursor: default;
}
.topbar-user .ic { width: 14px; height: 14px; color: #6d7891; }

/* --------------------------- Content panel --------------------------- */
.content { flex: 1; min-height: 0; margin: 12px 12px 12px 14px; display: flex; }
.panel {
  flex: 1; min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* Toolbar */
.toolbar {
  min-height: 56px; flex: 0 0 auto;
  display: flex; align-items: center; flex-wrap: wrap; gap: 5px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line-soft);
}
.field {
  height: 32px; flex: 0 0 auto;
  display: flex; align-items: center;
  border: 1px solid var(--field-line);
  border-radius: var(--radius-ctrl);
  background: var(--surface);
  padding: 0 10px;
  font-size: 12px; color: var(--ink-placeholder);
  transition: border-color var(--ease), box-shadow var(--ease);
}
.field:focus-within { border-color: #93a6e6; box-shadow: var(--focus-ring); }
.field input {
  width: 100%; border: 0; outline: 0; background: transparent;
  font-size: 12px; color: var(--ink-strong); padding: 0;
}
.field input::placeholder { color: var(--ink-placeholder); }
.field-search { width: 132px; }
.select-wrap { position: relative; flex: 0 0 auto; }
.select-wrap .field { width: 108px; padding-right: 26px; appearance: none; cursor: pointer; color: var(--ink-placeholder); }
.select-wrap.wide .field { width: 132px; }
.select-wrap.narrow .field { width: 96px; }
.select-wrap .field.has-value { color: var(--ink-strong); }
.select-wrap .caret {
  position: absolute; right: 9px; top: 10px;
  width: 12px; height: 12px; color: #aab3c4; pointer-events: none;
}
.toolbar-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.btn {
  height: 32px; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 9px;
  border: 1px solid var(--field-line);
  border-radius: var(--radius-ctrl);
  background: var(--surface);
  color: #5b657a; font-size: 12px; white-space: nowrap;
  transition: background var(--ease), border-color var(--ease), color var(--ease);
}
.btn:hover { background: #f8faff; border-color: #bdc9e9; color: var(--link); }
.btn .ic { width: 13px; height: 13px; }
.btn-primary {
  background: var(--brand); border-color: var(--brand);
  color: #fff; font-weight: 500;
  box-shadow: 0 2px 6px rgba(30,42,107,.18);
}
.btn-primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); color: #fff; }
.btn-primary .ic { width: 13px; height: 13px; stroke-width: 2; }

/* Table */
.table-scroll { flex: 1; min-height: 0; overflow: auto; position: relative; }
.table-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.table-scroll::-webkit-scrollbar-track { background: #f6f8fd; }
.table-scroll::-webkit-scrollbar-thumb { background: #cbd8f0; border-radius: 6px; border: 2px solid #f6f8fd; }
.table-scroll::-webkit-scrollbar-thumb:hover { background: #b3c5e8; }
.grid {
  width: 100%; min-width: 1180px;
  border-collapse: separate; border-spacing: 0;
  table-layout: fixed; font-size: 12.5px;
}
.grid th {
  position: sticky; top: 0; z-index: 2;
  height: 44px; padding: 0 12px;
  background: var(--thead-bg);
  color: #5b6579; font-weight: 500; text-align: left;
  border-bottom: 1px solid #dfe5f2;
  white-space: nowrap;
}
.grid td {
  height: 62px; padding: 8px 12px;
  border-bottom: 1px solid var(--line-soft);
  color: var(--ink); vertical-align: middle;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.grid tbody tr:nth-child(even) td { background: #fbfcff; }
.grid tbody tr:hover td { background: var(--row-hover); }
.grid td.cell-wrap { white-space: normal; line-height: 1.55; word-break: break-all; }
.grid td .placeholder { color: var(--ink-muted); }
.empty-row td { height: 180px; text-align: center; color: var(--ink-muted); font-size: 13px; }

/* Tags */
.tag {
  display: inline-flex; align-items: center; justify-content: center;
  height: 20px; padding: 0 7px;
  border: 1px solid; border-radius: 3px;
  font-size: 11px; line-height: 1; white-space: nowrap;
  background: var(--surface);
}
button.tag { cursor: pointer; transition: filter var(--ease); }
button.tag:hover { filter: brightness(.97); }
.tag-role   { border-color: #d9dfeb; color: #8791a5; }
.tag-green  { border-color: var(--green-line); color: var(--green); background: var(--green-bg); }
.tag-red    { border-color: var(--red-line);   color: var(--red);   background: var(--red-bg); }
.tag-amber  { border-color: var(--amber-line); color: var(--amber); background: var(--amber-bg); }
.tag-gray   { border-color: #dfe4ee; color: #98a1b2; }

/* Row actions */
.acts { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.act {
  border: 0; background: transparent; padding: 0;
  color: var(--link); font-size: 12px; line-height: 1;
  transition: color var(--ease);
}
.act:hover { color: var(--link-hover); text-decoration: underline; }
.act.act-muted { color: #8490a6; }
.act.act-muted:hover { color: var(--link-hover); }

/* Pager */
.pager {
  height: 52px; flex: 0 0 52px;
  display: flex; align-items: center; justify-content: flex-end; gap: 7px;
  padding: 0 16px;
  border-top: 1px solid var(--line-soft);
  font-size: 12px; color: #6b7488;
}
.pager .total { margin-right: 4px; white-space: nowrap; }
.pg {
  height: 30px; min-width: 30px; padding: 0 7px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid #e1e6f0; border-radius: 4px;
  background: var(--surface); color: #5b657a;
  font-size: 12px;
  transition: border-color var(--ease), color var(--ease);
}
.pg:hover:not(:disabled):not(.active) { border-color: #b6c3e6; color: var(--link); }
.pg.active { border-color: #2a3b8f; color: #22337d; font-weight: 600; }
.pg:disabled { opacity: .5; cursor: not-allowed; }
.pg .ic { width: 12px; height: 12px; color: #9ba4b6; }
.pg-dots { color: #98a1b2; letter-spacing: 1px; padding: 0 2px; }
.page-size {
  height: 30px; margin-left: 6px;
  border: 1px solid #e1e6f0; border-radius: 4px;
  background: var(--surface); color: #5b657a;
  font-size: 12px; padding: 0 8px; cursor: pointer;
}

/* ===================================================================
   Overlays
   =================================================================== */
/* Popconfirm — floats above the trigger button */
.popconfirm {
  position: fixed; z-index: 70; display: none;
  min-width: 132px; padding: 10px 12px;
  background: var(--surface);
  border: 1px solid #e3e8f2; border-radius: 8px;
  box-shadow: var(--shadow-pop);
}
.popconfirm.show { display: block; }
.popconfirm::after {
  content: ""; position: absolute; bottom: -6px; left: 50%;
  width: 10px; height: 10px; margin-left: -5px;
  background: var(--surface);
  border-right: 1px solid #e3e8f2; border-bottom: 1px solid #e3e8f2;
  transform: rotate(45deg);
}
.popconfirm[data-arrow="top"]::after {
  bottom: auto; top: -6px;
  border-right: 0; border-bottom: 0;
  border-left: 1px solid #e3e8f2; border-top: 1px solid #e3e8f2;
}
.pop-text { font-size: 12px; color: #4a5468; margin-bottom: 10px; white-space: nowrap; }
.pop-actions { display: flex; justify-content: flex-end; gap: 8px; }
.pop-btn {
  height: 24px; padding: 0 10px;
  border: 1px solid var(--field-line); border-radius: 4px;
  background: var(--surface); color: #5b657a; font-size: 11px;
}
.pop-btn:hover { border-color: #bdc9e9; color: var(--link); }
.pop-btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.pop-btn.primary:hover { background: var(--brand-hover); color: #fff; }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 80; display: none;
  align-items: center; justify-content: center;
  background: rgba(24,32,56,.36);
  backdrop-filter: blur(2px);
}
.modal-backdrop.show { display: flex; }
.modal {
  width: 500px; max-width: calc(100vw - 32px);
  background: var(--surface); border-radius: 12px;
  box-shadow: 0 22px 60px rgba(20,30,70,.24);
  overflow: hidden;
  animation: pop-in 180ms ease both;
}
@keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
.modal-head {
  height: 52px; padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid #edf0f6;
  font-size: 15px; font-weight: 600; color: var(--ink-strong);
}
.modal-body { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-row { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.form-row.full { grid-column: 1 / -1; }
.form-row label { font-size: 12px; color: #6b7488; }
.form-row label .req { color: #d4655f; margin-left: 2px; }
.form-row input, .form-row select {
  height: 32px; width: 100%;
  border: 1px solid var(--field-line); border-radius: 4px;
  padding: 0 10px; background: var(--surface);
  font-size: 12.5px; color: var(--ink-strong); outline: 0;
}
.form-row input:focus, .form-row select:focus { border-color: #93a6e6; box-shadow: var(--focus-ring); }
.form-error { grid-column: 1 / -1; font-size: 12px; color: var(--red); min-height: 0; }
.modal-foot {
  padding: 14px 20px; border-top: 1px solid #edf0f6;
  display: flex; justify-content: flex-end; gap: 8px;
}

/* Audit modal */
.audit-modal { width: 452px; }
.audit-summary {
  grid-column: 1 / -1;
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px;
  padding: 10px 12px;
  background: #f7f9fd; border: 1px solid #e9edf6; border-radius: 6px;
  font-size: 12px; color: #7c8699;
}
.audit-summary b { color: var(--ink-strong); font-weight: 600; }
.audit-options { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.audit-option {
  position: relative; display: flex; flex-direction: column; gap: 4px;
  padding: 10px 12px; border: 1px solid var(--field-line); border-radius: 6px;
  cursor: pointer; user-select: none;
  transition: border-color var(--ease), background var(--ease), box-shadow var(--ease);
}
.audit-option:hover { border-color: #b6c4e8; }
.audit-option.selected { border-color: #7f96e0; background: #f4f7ff; box-shadow: var(--focus-ring); }
.audit-option input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.audit-option .opt-title { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; color: #46516a; }
.audit-option .radio-dot { width: 13px; height: 13px; border: 1.5px solid #b9c3d8; border-radius: 50%; position: relative; flex: 0 0 auto; }
.audit-option.selected .radio-dot { border-color: #3b5bdb; }
.audit-option.selected .radio-dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: #3b5bdb; }
.audit-option small { font-size: 11px; color: #98a1b2; padding-left: 21px; }
.form-row[hidden] { display: none; }
.form-row textarea {
  width: 100%; min-height: 64px; resize: vertical; line-height: 1.5;
  border: 1px solid var(--field-line); border-radius: 4px;
  padding: 8px 10px; font-size: 12.5px; color: var(--ink-strong); outline: 0;
}
.form-row textarea:focus { border-color: #93a6e6; box-shadow: var(--focus-ring); }
.form-row textarea::placeholder { color: var(--ink-placeholder); }
.reason-label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.char-count { font-size: 11px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.char-count.near-limit { color: var(--amber); font-weight: 600; }

/* 「审核未通过」专用标记：仅审核驳回且仍禁用的数据显示 */
.reject-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; margin-left: 6px;
  border-radius: 50%; background: #e8928c; color: #fff;
  font-size: 11px; font-style: normal; font-weight: 700; line-height: 1;
  cursor: help; vertical-align: middle; user-select: none;
  transition: background var(--ease), transform var(--ease);
}
.reject-mark:hover, .reject-mark:focus-visible { background: #d9695f; transform: scale(1.08); outline: 0; }
.reject-mark:focus-visible { box-shadow: var(--focus-ring); }

/* 悬停原因浮层（fixed 定位，避免被表格单元格 overflow 裁剪） */
.reject-tip {
  position: fixed; z-index: 120; max-width: 268px; min-width: 148px;
  padding: 9px 12px; border-radius: 6px;
  background: var(--surface); border: 1px solid #e3e8f2;
  box-shadow: 0 8px 24px rgba(30,40,80,.16);
  font-size: 12px; line-height: 1.6; color: #4a5468;
  pointer-events: none;
}
.reject-tip[hidden] { display: none; }
.reject-tip b { display: block; color: #d95b50; font-size: 12.5px; font-weight: 600; margin-bottom: 3px; }
.reject-tip span { display: block; white-space: normal; word-break: break-all; }
.reject-tip::after {
  content: ""; position: absolute; left: var(--arrow-x, 50%); margin-left: -5px;
  width: 10px; height: 10px; background: var(--surface);
  border: 1px solid #e3e8f2; transform: rotate(45deg);
}
.reject-tip[data-place="top"]::after { bottom: -6px; border-top: 0; border-left: 0; }
.reject-tip[data-place="bottom"]::after { top: -6px; border-bottom: 0; border-right: 0; }
.act-audit { font-weight: 500; color: #2f49a8; }
.cell-time { font-size: 12px; padding-right: 6px; }
.grid td.audit-cell { padding-left: 8px; padding-right: 6px; }

/* Toast */
.toast {
  position: fixed; z-index: 95; top: 20px; left: 50%;
  transform: translate(-50%, -14px);
  opacity: 0; pointer-events: none;

  }
  function nowStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
           pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');

    for (var i = 0; i < dataset.length; i++) if (dataset[i].id === id) return dataset[i];
    return null;
  }

  /* =================================================================
     Filter options
     ================================================================= */
  function regionArea(region) {
    var v = String(region || ''), i = v.indexOf(':');
    return i > -1 ? v.slice(i + 1) : v;
  }
  (function fillSelects() {
    var orgSel = $('orgFilter'), verSel = $('versionFilter'), areaSel = $('areaFilter');
    var seen = {};
    ORGS.filter(function (o) { return o !== '-'; }).forEach(function (o) {
      var op = document.createElement('option'); op.value = o; op.textContent = o; orgSel.appendChild(op);
    });
    REGIONS.forEach(function (r) {
      var op = document.createElement('option'); op.value = r; op.textContent = r; verSel.appendChild(op);
      var area = regionArea(r);
      if (!seen[area]) {
        seen[area] = 1;
        var ap = document.createElement('option'); ap.value = area; ap.textContent = area; areaSel.appendChild(ap);
      }
    });
  }());

  function syncSelectTone(sel) {
    if (sel.value) sel.classList.add('has-value'); else sel.classList.remove('has-value');
  }

  /* =================================================================
     Render
     ================================================================= */
  function filtered() {
    var kw = state.keyword.trim().toLowerCase();
    return dataset.filter(function (r) {
      if (kw && (r.account + ' ' + r.name + ' ' + r.phone).toLowerCase().indexOf(kw) === -1) return false;
      if (state.org && r.org !== state.org) return false;
      if (state.type === 'phone' && !/^1\d{10}$/.test(r.account)) return false;
      if (state.type === 'account' && /^1\d{10}$/.test(r.account)) return false;
      if (state.role && r.role !== state.role) return false;
      if (state.version && r.region !== state.version) return false;
      if (state.area && regionArea(r.region) !== state.area) return false;
      if (state.status && r.status !== state.status) return false;
      if (state.audit && r.audit !== state.audit) return false;
      return true;
    });
  }

  function rowHtml(r) {
    var isDisabled = r.status === '禁用';
    var statusCls = isDisabled ? 'tag-red' : 'tag-green';
    var wechatCls = r.wechat === '已绑定' ? 'tag-green' : 'tag-gray';
    var unbind = r.wechat === '已绑定'
      ? '<button class="act" data-act="unbind" data-id="' + r.id + '">解绑微信</button>' : '';
    /* 审核为一次性操作：凡显示「待审核」且未审核过的数据均可进入审核 */
    var audit = (r.audit === '待审核' && !r.audited && !r.rejectReason)
      ? '<button class="act act-audit" data-act="audit" data-id="' + r.id + '">审核</button>' : '';
    /* 审核结果列：通过 / 驳回 / 待审核（异常数据兜底为 -） */
    var isRejected = r.audit === '驳回';
    var rejectReason = r.rejectReason || '';
    /* 「审核未通过」专用标记：只跟在审核列取值为「驳回」的后面 */
    var rejectMark = (isRejected && rejectReason)
      ? '<span class="reject-mark" tabindex="0" role="img" data-reject-reason="' + esc(rejectReason) +
        '" aria-label="审核未通过，驳回原因：' + esc(rejectReason) + '">!</span>' : '';
    var auditCell = isRejected
      ? '<span class="tag tag-red">驳回</span>' + rejectMark
      : (r.audit === '通过' ? '<span class="tag tag-green">通过</span>'
        : (r.audit === '待审核' ? '<span class="tag tag-amber">待审核</span>'
          : '<span class="placeholder">-</span>'));
    return '<tr data-id="' + r.id + '">' +
      '<td>' + esc(r.account) + '</td>' +
      '<td>' + (r.name === '-' ? '<span class="placeholder">-</span>' : esc(r.name)) + '</td>' +
      '<td>' + (r.phone === '-' ? '<span class="placeholder">-</span>' : esc(r.phone)) + '</td>' +
      '<td class="cell-wrap">' + (r.org === '-' ? '<span class="placeholder">-</span>' : esc(r.org)) + '</td>' +
      '<td title="' + esc(r.region) + '">' + esc(r.region) + '</td>' +
      '<td><span class="tag tag-role">' + esc(r.role) + '</span></td>' +
      '<td><button class="tag ' + statusCls + '" data-act="status" data-id="' + r.id + '" title="点击切换状态">' + esc(r.status) + '</button></td>' +
      '<td class="audit-cell">' + auditCell + '</td>' +
      '<td><button class="tag ' + wechatCls + '" data-act="wechat" data-id="' + r.id + '" title="点击切换绑定状态">' + esc(r.wechat) + '</button></td>' +
      '<td class="cell-time">' + esc(r.created) + '</td>' +
      '<td><div class="acts">' +
        '<button class="act" data-act="edit" data-id="' + r.id + '">编辑</button>' +
        '<button class="act" data-act="reset" data-id="' + r.id + '">重置密码</button>' +
        unbind +
        audit +
        '<button class="act act-muted" data-act="delete" data-id="' + r.id + '">删除</button>' +
      '</div></td>' +
    '</tr>';
  }

  function pagerHtml(total, pages) {
    var parts = [];
    parts.push('<span class="total">共 ' + total + ' 条</span>');
    parts.push('<button class="pg" data-page="prev" ' + (state.page <= 1 ? 'disabled' : '') + ' aria-label="上一页"><svg class="ic"><use href="#i-chevron-left"/></svg></button>');

    var nums = [];
    if (pages <= 7) {
      for (var i = 1; i <= pages; i++) nums.push(i);
    } else if (state.page <= 4) {
      nums = [1, 2, 3, 4, 5];
    } else if (state.page >= pages - 3) {
      nums = [1, pages - 4, pages - 3, pages - 2, pages - 1, pages];
    } else {
      nums = [1, state.page - 1, state.page, state.page + 1, state.page + 2];
    }
    var last = 0;
    nums.forEach(function (n) {
      if (n - last > 1) parts.push('<span class="pg-dots">…</span>');
      parts.push('<button class="pg' + (n === state.page ? ' active' : '') + '" data-page="' + n + '"' +
        (n === state.page ? ' aria-current="page"' : '') + '>' + n + '</button>');
      last = n;
    });
    if (pages > 7 && last < pages) {
      if (pages - last > 1) parts.push('<span class="pg-dots">…</span>');
      parts.push('<button class="pg' + (pages === state.page ? ' active' : '') + '" data-page="' + pages + '">' + pages + '</button>');
    }

    parts.push('<button class="pg" data-page="next" ' + (state.page >= pages ? 'disabled' : '') + ' aria-label="下一页"><svg class="ic"><use href="#i-chevron-right"/></svg></button>');
    parts.push('<select class="page-size" id="pageSize" aria-label="每页条数">' +
      [10, 20, 50, 100].map(function (n) {
        return '<option value="' + n + '"' + (n === state.pageSize ? ' selected' : '') + '>' + n + ' 条/页</option>';
      }).join('') + '</select>');
    return parts.join('');
  }

  function render() {
    $('rejectTip').hidden = true;
    var list = filtered();
    var pages = Math.max(1, Math.ceil(list.length / state.pageSize));
    if (state.page > pages) state.page = pages;
    var start = (state.page - 1) * state.pageSize;
    var rows = list.slice(start, start + state.pageSize);
    $('tbody').innerHTML = rows.length
      ? rows.map(rowHtml).join('')
      : '<tr class="empty-row"><td colspan="11">暂无符合条件的用户</td></tr>';
    $('pager').innerHTML = pagerHtml(list.length, pages);
  }

  /* =================================================================
     Popconfirm (floats above the trigger button)
     ================================================================= */
  var popAction = null;
  function openPop(anchor, text, onOk) {
    var pop = $('popconfirm');
    $('popText').textContent = text;
    popAction = onOk;
    pop.classList.add('show');
    var a = anchor.getBoundingClientRect();
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var left = a.left + a.width / 2 - w / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
    var top = a.top - h - 10;
    if (top < 8) top = a.bottom + 10;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    pop.dataset.arrow = (top < a.top) ? 'bottom' : 'top';
  }
  function closePop() { $('popconfirm').classList.remove('show'); popAction = null; }
  $('popCancel').addEventListener('click', closePop);
  $('popOk').addEventListener('click', function () {
    var fn = popAction;
    closePop();
    if (fn) fn();
  });
  document.addEventListener('mousedown', function (e) {
    if (!$('popconfirm').classList.contains('show')) return;
    if (!$('popconfirm').contains(e.target)) closePop();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePop(); closeAudit(); } });

  /* =================================================================
     Audit modal — 通过 / 不通过（驳回需填写原因）
     ================================================================= */
  var auditingId = null;
  var REASON_MAX = 30;
  /* 驳回原因字数：与 textarea 的 maxlength 保持同一计数口径 */
  function syncReasonCount() {
    var n = $('fReason').value.length;
    var c = $('reasonCount');
    c.textContent = n + '/' + REASON_MAX;
    c.classList.toggle('near-limit', n >= REASON_MAX - 5);
    c.setAttribute('aria-label', '已输入 ' + n + ' 字，最多 ' + REASON_MAX + ' 字');
  }
  $('fReason').addEventListener('input', syncReasonCount);
  function syncAuditOption() {
    var form = $('auditForm');
    var checked = form.querySelector('input[name="auditResult"]:checked');
    var isReject = !!checked && checked.value === 'reject';
    form.querySelectorAll('.audit-option').forEach(function (label) {
      label.classList.toggle('selected', label.querySelector('input').checked);
    });
    $('reasonRow').hidden = !isReject;
    $('auditError').textContent = '';
  }
  function openAudit(row) {
    auditingId = row.id;
    $('auditSummary').innerHTML =
      '<span>账号 <b>' + esc(row.account) + '</b></span>' +
      '<span>用户名 <b>' + esc(row.name) + '</b></span>' +
      '<span>角色 <b>' + esc(row.role) + '</b></span>' +
      (row.rejectReason ? '<span>上次驳回 <b>' + esc(row.rejectReason) + '</b></span>' : '');
    $('auditForm').reset();
    $('fReason').value = '';
    syncReasonCount();
    $('auditBackdrop').classList.add('show');
    syncAuditOption();
  }
  function closeAudit() { $('auditBackdrop').classList.remove('show'); auditingId = null; }
  $('auditClose').addEventListener('click', closeAudit);
  $('auditCancel').addEventListener('click', closeAudit);
  $('auditBackdrop').addEventListener('mousedown', function (e) {
    if (e.target === this) closeAudit();
  });
  $('auditForm').addEventListener('change', syncAuditOption);
  $('auditForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var row = findRow(auditingId);
    if (!row) { closeAudit(); return; }
    var checked = this.querySelector('input[name="auditResult"]:checked');
    var result = checked ? checked.value : 'pass';
    if (result === 'reject') {
      var reason = $('fReason').value.trim();
      if (!reason) { $('auditError').textContent = '请输入驳回原因'; $('fReason').focus(); return; }
      if (reason.length > REASON_MAX) {
        $('auditError').textContent = '驳回原因最多 ' + REASON_MAX + ' 个字';
        $('fReason').focus(); return;
      }
      row.status = '禁用';
      row.audit = '驳回';
      row.rejectReason = reason;
      row.audited = true;
      closeAudit(); render(); toast('已驳回，原因已记录');
    } else {
      row.status = '启用';
      row.audit = '通过';
      row.rejectReason = '';
      row.audited = true;
      closeAudit(); render(); toast('审核通过，状态已启用');
    }
  });

  /* =================================================================
     「审核未通过」标记 — 悬停 / 键盘聚焦显示审核未通过及驳回原因
     ================================================================= */
  (function rejectTooltip() {
    var tip = $('rejectTip'), reasonEl = $('rejectTipReason'), current = null;
    function hide() { current = null; tip.hidden = true; }
    function place(el) {
      if (!el.isConnected) { hide(); return; }
      var a = el.getBoundingClientRect();
      tip.hidden = false;
      var w = tip.offsetWidth, h = tip.offsetHeight;
      var left = Math.max(8, Math.min(a.left + a.width / 2 - w / 2, window.innerWidth - w - 8));
      var top = a.top - h - 10, below = false;
      if (top < 8) { top = a.bottom + 10; below = true; }
      tip.dataset.place = below ? 'bottom' : 'top';
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
      tip.style.setProperty('--arrow-x',
        Math.max(12, Math.min(a.left + a.width / 2 - left, w - 12)) + 'px');
    }
    function show(el) {
      current = el;
      reasonEl.textContent = '驳回原因：' + (el.dataset.rejectReason || '');
      place(el);
    }
    document.addEventListener('mouseover', function (e) {
      var el = e.target.closest ? e.target.closest('.reject-mark') : null;
      if (el) show(el);
    });
    document.addEventListener('mouseout', function (e) {
      var el = e.target.closest ? e.target.closest('.reject-mark') : null;
      if (el && current === el) hide();
    });
    document.addEventListener('focusin', function (e) {
      var el = e.target.closest ? e.target.closest('.reject-mark') : null;
      if (el) show(el);
    });
    document.addEventListener('focusout', function (e) {
      var el = e.target.closest ? e.target.closest('.reject-mark') : null;
      if (el) hide();
    });
    window.addEventListener('scroll', function () { if (current) place(current); }, true);
    window.addEventListener('resize', function () { if (current) place(current); });
  }());

  /* =================================================================
     Toolbar actions
     ================================================================= */
  var searchTimer = null;
  $('searchInput').addEventListener('input', function () {
    var v = this.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { state.keyword = v; state.page = 1; render(); }, 140);
  });
  [['orgFilter','org'], ['typeFilter','type'], ['roleFilter','role'], ['versionFilter','version'],
   ['areaFilter','area'], ['statusFilter','status'], ['auditFilter','audit']]
    .forEach(function (pair) {
      $(pair[0]).addEventListener('change', function () {
        state[pair[1]] = this.value;
        state.page = 1;
        syncSelectTone(this);
        render();
      });
    });

  $('refreshBtn').addEventListener('click', function () {
    $('searchInput').value = '';
    ['orgFilter','typeFilter','roleFilter','versionFilter','areaFilter','statusFilter','auditFilter'].forEach(function (id) {
      $(id).value = ''; syncSelectTone($(id));
    });
    state.keyword = state.org = state.type = state.role = state.version = state.area = state.status = state.audit = '';
    state.page = 1;
    render();
    toast('列表已刷新');
  });

  $('templateBtn').addEventListener('click', function () {
    var csv = '\uFEFF账号,用户名,手机号,单位,区域,角色\n' +
      '13800000000,示例用户,13800000000,示例单位,' + REGIONS[0] + ',注册用户\n';
    var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url; a.download = '用户导入模板.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('导入模板已下载');
  });

  $('importBtn').addEventListener('click', function () { $('fileInput').click(); });
  $('fileInput').addEventListener('change', function () {
    var file = this.files && this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var lines = String(reader.result).replace(/^\uFEFF/, '').split(/\r?\n/).filter(function (l) { return l.trim(); });
      if (lines.length < 2) { toast('文件中没有可导入的数据'); return; }
      var heads = lines[0].split(',').map(function (s) { return s.trim(); });
      var at = function (name) { return heads.indexOf(name); };
      var added = 0;
      lines.slice(1).forEach(function (line) {
        var cells = line.split(',').map(function (s) { return s.trim().replace(/^"|"$/g, ''); });
        var acc = cells[at('账号')];
        if (!acc || dataset.some(function (r) { return r.account === acc; })) return;
        dataset.unshift({
          id: newId(), account: acc,
          name: cells[at('用户名')] || '-', phone: cells[at('手机号')] || '-',
          org: cells[at('单位')] || '-', region: cells[at('区域')] || REGIONS[0],
          role: cells[at('角色')] || '注册用户', status: '启用', wechat: '未绑定',
          audit: '通过', audited: false, rejectReason: '', created: nowStr()
        });
        added++;
      });
      state.page = 1;
      render();
      toast(added ? ('成功导入 ' + added + ' 条用户数据') : '没有新增数据（账号可能已存在）');
    };
    reader.readAsText(file, 'utf-8');
    this.value = '';
  });

  /* =================================================================
     Table row actions (event delegation)
     ================================================================= */
  $('tbody').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var id = btn.dataset.id, act = btn.dataset.act;
    var row = findRow(id);
    if (!row) return;

    if (act === 'audit') {
      if (row.audited) { toast('该账号已审核，不能重复审核'); return; }
      openAudit(row); return;
    }
    if (act === 'reset') {
      openPop(btn, '确认重置？', function () { toast('密码已重置'); });
      return;
    }
    if (act === 'status') {
      var nextStatus = row.status === '启用' ? '禁用' : '启用';
      openPop(btn, '确认' + nextStatus + '？', function () {
        row.status = nextStatus;
        if (nextStatus === '启用') { row.rejectReason = ''; row.audit = '通过'; row.audited = true; }
        else { row.audit = '待审核'; row.rejectReason = ''; row.audited = false; }
        render(); toast('状态已' + nextStatus);
      });
      return;
    }
    if (act === 'wechat') {
      var nextWechat = row.wechat === '已绑定' ? '未绑定' : '已绑定';
      openPop(btn, '确认' + nextWechat + '？', function () {
        row.wechat = nextWechat; render(); toast('微信状态已更新');
      });
      return;
    }
    if (act === 'unbind') {
      openPop(btn, '确认解绑？', function () {
        row.wechat = '未绑定'; render(); toast('已解绑微信');
      });
      return;
    }
    if (act === 'delete') {
      openPop(btn, '确认删除？', function () {
        var idx = dataset.indexOf(row);
        if (idx > -1) dataset.splice(idx, 1);
        render(); toast('已删除');
      });
    }
  });

  /* =================================================================
     Pager
     ================================================================= */
  $('pager').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-page]');
    if (!btn || btn.disabled) return;
    var v = btn.dataset.page;
    var pages = Math.max(1, Math.ceil(filtered().length / state.pageSize));
    if (v === 'prev') state.page = Math.max(1, state.page - 1);
    else if (v === 'next') state.page = Math.min(pages, state.page + 1);
    else state.page = parseInt(v, 10);
    render();
    $('tableScroll').scrollTop = 0;
  });
  $('pager').addEventListener('change', function (e) {
    if (e.target.id !== 'pageSize') return;
    state.pageSize = parseInt(e.target.value, 10);
    state.page = 1;
    render();
    $('tableScroll').scrollTop = 0;
  });

  /* =================================================================
     Sidebar behaviour
     ================================================================= */
  $('collapseBtn').addEventListener('click', function () {
    $('shell').classList.toggle('collapsed');
  });
  $('nav').addEventListener('click', function (e) {
    var item = e.target.closest('.nav-item');
    if (item) {
      var open = item.classList.toggle('open');
      item.setAttribute('aria-expanded', open ? 'true' : 'false');
      var children = item.parentNode.querySelector('.nav-children');
      if (children) children.classList.toggle('is-hidden', !open);
      return;
    }
    var child = e.target.closest('.nav-child');
    if (!child) return;
    if (child.classList.contains('active')) return;
    $('nav').querySelectorAll('.nav-child').forEach(function (c) {
      c.classList.remove('active'); c.removeAttribute('aria-current');
    });
    child.classList.add('active');
    child.setAttribute('aria-current', 'page');
    $('crumbCurrent').textContent = child.dataset.page;
    document.title = child.dataset.page + ' · 智能维护管理';
    toast('已切换到「' + child.dataset.page + '」（演示视图）');
  });
  $('nav').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.target.click(); }
  });

  /* =================================================================
     Boot
     ================================================================= */
  render();
}());
</script>
</body>
</html>
